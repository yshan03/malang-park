<style>

    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  .scene {
    position: relative; isolation: isolate; width: min(100%, 470px); min-height: 550px;
    height: 100svh; margin: auto; overflow: hidden;
    background: linear-gradient(#b3d3e4, #e7eddf 65%);

  .tmi svg { width: 35px; height: 35px; }
  .tree-notes {
    width: min(calc(100% - 32px), 375px); max-height: calc(100svh - 48px);
    border: 0; border-radius: 20px; padding: 22px; color: #294838;
    background: #faf8ec; box-shadow: 0 12px 36px #24382535;
  }
  .tree-notes::backdrop { background: #24382555; }
  .tree-notes h2 { margin: 0 44px 8px 0; font: 700 30px/1.1 Gaegu, system-ui, sans-serif; }
  .tree-notes .tree-photo { display: block; width: 100%; height: auto; margin: 0 0 12px; border-radius: 10px; -webkit-user-drag: none; }
  .tree-notes p { font: 700 18px/1.45 Gaegu, system-ui, sans-serif; }
  .tree-notes p + p { margin-top: 10px; }
  .tree-notes .close {
    position: absolute; top: 8px; right: 8px; width: 44px; height: 44px;
    border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 24px; cursor: pointer;
  }
  .tree-notes .close:focus { outline: none; }
  .tree-notes .close:focus-visible { text-decoration: underline; }
  .back svg { display: block; width: 16px; height: 16px; }
  .controls { bottom: max(26px, calc(env(safe-area-inset-bottom) + 16px)); padding: 0 20px; }
  .prompt { font: 700 25px/1.1 Gaegu, system-ui, sans-serif; margin: 0 0 12px; }
  .mic {
    display: inline-flex; align-items: center; gap: 8px; min-height: 48px; width: 51px; justify-content: center; padding: 0; border: 0; cursor: pointer;
    background: #305d47; color: #fffcf0; text-decoration: none; border-radius: 100px;
    font-weight: 700; box-shadow: 0 3px 0 #244b38;
    touch-action: none; user-select: none; -webkit-touch-callout: none;
  }
  .mic:active { transform: translateY(2px); box-shadow: 0 1px 0 #244b38; }
  .mic[aria-pressed="true"] { background: #447c59; box-shadow: 0 0 0 4px #deebbc; }
  .mic svg { width: 18px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
  :is(a, button):focus-visible { outline: 2px solid #294838; outline-offset: 3px; }
  @media (min-width: 560px) {
    body { display: grid; place-items: center; min-height: 100svh; }
    .scene { height: min(calc(100svh - 24px), 860px); width: min(100vw - 24px, 420px); border-radius: 22px; box-shadow: 0 6px 28px #33442d22; }
  }
  @media (max-height: 650px) {
    h1 { margin-top: 18px; }
    .controls { bottom: max(16px, env(safe-area-inset-bottom)); }
  }
</style>

<script>
function drawTree() {
  const lin = h => new THREE.Color(h).convertSRGBToLinear();
  const dark = lin('#243825'), middle = lin('#465e30'), light = lin('#789449');
  const facing = .35;
  const depthX = Math.sin(facing), depthZ = -Math.cos(facing);
  let seed = 7;
  function random() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }

  // 사진의 밑단, 넓은 중하단, 좁아지는 어깨와 둥근 꼭대기를 차례로 잡는다.
  const crownWidths = [0, .59, .83, .98, 1.01, .91, .82, .71, .69, .60, 0];

  function crownProfile(height) {
    const sample = THREE.MathUtils.clamp(height * (crownWidths.length - 1), 0, crownWidths.length - 1);
    const index = Math.min(Math.floor(sample), crownWidths.length - 2);
    return THREE.MathUtils.lerp(crownWidths[index], crownWidths[index + 1], sample - index);
  }

  function foliageGeometry(phase, widthSegments = 28, heightSegments = 18) {
    const geometry = new THREE.SphereGeometry(1, widthSegments, heightSegments);
    const positions = geometry.attributes.position;
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i), y = positions.getY(i), z = positions.getZ(i);
      const lobes = .11 * Math.sin(x * 9 + phase) * Math.sin(y * 8 + z * 5)
        + .055 * Math.cos(z * 17 - y * 9 + phase) * Math.cos(x * 13 + z * 6);
      positions.setXYZ(i, x * (1 + lobes), y * (1 + lobes), z * (1 + lobes));
    }
    geometry.computeVertexNormals();
    return geometry;
  }

  function cedarTextures() {
    const branches = [
      "M0 4Q4 -18 -1 -42Q-4 -50 -1 -58",
      "M0 -5Q-12 -14 -31 -17",
      "M1 -7Q15 -13 31 -23",
      "M0 -16Q-11 -23 -24 -31",
      "M1 -17Q13 -25 24 -35",
      "M0 -27Q-10 -34 -18 -43",
      "M0 -30Q10 -37 15 -46"
].map(path => new Path2D(path));
    const twigs = [
      "M-9 -11Q-16 -19 -18 -24M-17 -14Q-25 -13 -31 -12M-22 -16Q-26 -22 -30 -24",
      "M10 -12Q14 -19 17 -24M17 -16Q23 -15 27 -16M23 -18Q28 -25 33 -27",
      "M-8 -22Q-10 -30 -15 -35M-15 -26Q-23 -25 -28 -26",
      "M9 -23Q12 -29 13 -35M16 -29Q22 -27 27 -29",
      "M-8 -34Q-8 -40 -11 -45M-12 -38Q-19 -37 -22 -38",
      "M8 -36Q9 -42 10 -47M10 -40Q16 -40 19 -43",
      "M-2 -43Q-9 -46 -10 -51M-2 -49Q5 -52 7 -56"
].map(path => new Path2D(path));
    let textureSeed = 1207;
    function next() {
      textureSeed = (textureSeed * 16807) % 2147483647;
      return textureSeed / 2147483647;
    }

    function paintSprig(ctx, x, y, angle, scale, tone, showScales = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = ["rgb(", tone, ",", tone, ",", tone, ")"].join("");
      ctx.lineWidth = 5.6;
      branches.forEach(path => ctx.stroke(path));
      ctx.lineWidth = 4.8;
      twigs.forEach(path => ctx.stroke(path));
      if (showScales) {
        ctx.strokeStyle = 'rgba(255, 255, 234, .15)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([1.3, 2]);
        [...branches, ...twigs].forEach(path => ctx.stroke(path));
      }
      ctx.restore();
    }

    function texture(canvas) {
      const map = new THREE.CanvasTexture(canvas);
      map.anisotropy = 4;
      return map;
    }

    const spray = document.createElement('canvas');
    spray.width = spray.height = 96;
    paintSprig(spray.getContext('2d'), 48, 74, 0, 1.03, 204);

    const atlas = document.createElement('canvas');
    atlas.width = 512;
    atlas.height = 256;
    const ctx = atlas.getContext('2d');
    // 잎가지를 엇갈려 찍어 잎 사이로 드러나는 안쪽 면에도 잎결이 보이게 한다.
    ctx.fillStyle = 'rgba(115, 115, 115, .82)';
    ctx.fillRect(0, 0, atlas.width, atlas.height);
    for (let layer = 0; layer < 3; layer++) {
      for (let row = 0; row < 7; row++) {
        for (let column = 0; column < 10; column++) {
          const x = (column + .5 * (row % 2)) * (atlas.width / 10) + 23 * next();
          const y = (row + .65) * (atlas.height / 7) + 19 * next();
          const angle = (next() - .5) * 1.5 + .22 * Math.sin(column);
          const scale = (layer === 0 ? 1.42 : .85) + .48 * next();
          const tone = Math.round((layer === 0 ? 105 : 133) + (layer === 0 ? 53 : 78) * next());
          for (const shift of [-atlas.width, 0, atlas.width]) {
            paintSprig(ctx, x + shift, y, angle, scale, tone);
          }
        }
      }
    }
    const canopy = texture(atlas);
    canopy.wrapS = THREE.RepeatWrapping;
    return { canopy, spray: texture(spray) };
  }

  function crownClusters() {
    const crown = new THREE.Group();
    const { canopy, spray } = cedarTextures();
    const geometries = [0, 1.7, 3.4].map(phase => foliageGeometry(phase, 18, 12));
    const materials = Array.from({ length: 11 }, (_, i) => {
      const shade = i / 10;
      const color = shade < .58 ? dark.clone().lerp(middle, shade / .58)
        : middle.clone().lerp(light, (shade - .58) / .42);
      return new THREE.MeshStandardMaterial({
        color: color.lerp(middle, .49).multiplyScalar(1.32), map: canopy, alphaTest: .27, roughness: .96,
        side: THREE.DoubleSide,
      });
    });
    const rows = [
      { height: .12, count: 8 }, { height: .25, count: 11 },
      { height: .4, count: 12 }, { height: .55, count: 11 },
      { height: .70, count: 10 }, { height: .84, count: 8 },
      { height: .95, count: 6 },
    ];
    const spraysPerCluster = 10;
    const surfaceBands = 5;
    const spraysPerBand = 7;
    const surfaceSprays = surfaceBands * spraysPerBand;
    const touchups = [
      { x: .43, y: 1.06, width: .24, height: .25, count: 27, minDepth: .88, shade: 4 },
      { x: -.14, y: 2.46, width: .28, height: .18, count: 32, minDepth: .53, shade: 5 },
      { x: -.14, y: 2.45, width: .24, height: .17, count: 30, minDepth: .54, shade: 4, inner: true },
    ];
    // 왼쪽 앞잎이 눌려도 그 뒤에 남는 잎층을 위·가운데·아래에 보강한다.
    touchups.push(
      { x: -.42, y: 2.12, width: .25, height: .22, count: 32, shade: 5, inner: true, recess: .09 },
      { x: -.57, y: 1.62, width: .26, height: .31, count: 47, shade: 4, inner: true, recess: .10 },
      { x: -.49, y: 1.03, width: .24, height: .26, count: 37, shade: 4, inner: true, recess: .09 },
      { x: -.24, y: 2.57, width: .29, height: .12, count: 38, shade: 5, inner: true, recess: .075, coverCore: true },
      { x: .10, y: 2.60, width: .28, height: .13, count: 42, shade: 5, inner: true, recess: .075, coverCore: true },
    );
    const regularLeaves = rows.reduce((sum, row) => sum + row.count * (spraysPerCluster + surfaceSprays), 0);
    const patchLeaves = touchups.reduce((sum, area) => sum + area.count, 0);
    const leafCount = regularLeaves + patchLeaves;
    const fineLeaves = new THREE.InstancedMesh(new THREE.PlaneGeometry(2, 2),
      new THREE.MeshStandardMaterial({ map: spray, alphaTest: .4, side: THREE.DoubleSide, roughness: 1, alphaToCoverage: true }),
      leafCount);
    fineLeaves.frustumCulled = false;
    const detail = new THREE.Object3D();
    const fineLayout = [];
    rows.forEach(({ height, count }, row) => {
      for (let i = 0; i < count; i++) {
        const h = height + (random() - .5) * .095;
        const angle = 2 * Math.PI * i / count + row * 1.13 + (random() - .5) * .22;
        const radius = crownProfile(h) * (.79 + .13 * random());
        const screenX = Math.cos(angle - facing);
        const lowerEdge = 1 - THREE.MathUtils.smoothstep(h, .10, .30);
        const center = .08 * h - .075 * lowerEdge + .055 * Math.sin(Math.PI * h);
        // 왼쪽 아래 잎만 길게 늘어지고 오른쪽 밑단은 줄기 쪽으로 일찍 말린다.
        const hem = lowerEdge * (.10 * screenX - .09 * Math.max(0, -screenX) ** 3);
        const lowerRadius = radius * (1 - .17 * lowerEdge * Math.max(0, screenX));
        const size = .19 + .13 * random() + .04 * Math.sin(Math.PI * h);
        const shade = Math.round(Math.max(0, Math.min(10, 2 + 4 * h + Math.max(0, -Math.cos(angle)) + (random() - .46) * 4)));
        const puff = new THREE.Mesh(geometries[(row + i) % geometries.length], materials[shade]);
        puff.position.set(center + Math.cos(angle) * lowerRadius, .46 + h * 2.22 + hem,
          Math.sin(angle) * lowerRadius);
        puff.scale.set(size * (1 + .2 * random()), size * (1.03 + .24 * random()), size);
        puff.rotation.y = angle;
        puff.userData = { h, rest: puff.position.clone(), restScale: puff.scale.clone(), restRotation: puff.quaternion.clone(), windTilt: new THREE.Quaternion(), squeeze: 0 };
        crown.add(puff);

        // 잔잎 송이를 큰 덩어리의 표면에 얹어 수관 안쪽과 가장자리에 결을 만든다.
        for (let j = 0; j < spraysPerCluster; j++) {
          const spread = angle + (random() - .5) * 2.65;
          const rise = (j + random()) / spraysPerCluster * 1.65 - .88;
          const offset = Math.sqrt(1 - rise * rise) * size * (.93 + .23 * random());
          const index = fineLayout.length;
          fineLayout.push({

}

const micButton = document.getElementById('mic');
const windStatus = document.getElementById('wind-status');
let voiceStart = null, lastVoice = 0;
function showWindStatus(text) {
  if (windStatus.textContent !== text) windStatus.textContent = text;
}

const instructions = {
  off: '마이크를 꾹 누르고',
  starting: '마이크 사용을 허용해 주세요',
  calibrating: '누른 채 2초만 조용히 기다려 줘',
  listening: '후~ 불거나 말을 걸어봐',
  ended: '마이크가 끊겼어요 · 다시 켜 주세요',
  unavailable: '이 브라우저에서는 마이크를 사용할 수 없어요',
  error: '마이크를 켤 수 없어요 · 권한을 확인해 주세요',
};

const input = createLonetreeMic({
  reuseCalibration: true,
  windSound: true,
  onState(state) {
    const running = state === 'calibrating' || state === 'listening';
    micButton.setAttribute('aria-pressed', String(running));
    showWindStatus(instructions[state]);
    if (state !== 'listening') {
      voiceStart = null;
      lastVoice = 0;
      treeMotion.wind(0);
      if (state !== 'off') treeMotion.reply(0);
    }
  },
  onSample({ kind, strength, time, calibrationRemaining }) {
    if (kind === 'calibration') {
      if (calibrationRemaining > 0) {
        showWindStatus(`누른 채 ${Math.ceil(calibrationRemaining / 1000)}초만 조용히 기다려 줘`);
      }
      return;
    }
    treeMotion.wind(strength);
    if (kind === 'wind') {
      voiceStart = null;
      return;
    }
    if (kind === 'waiting') {
      voiceStart = null;
    } else if (kind === 'voice') {
      voiceStart ??= time;
      lastVoice = time;
    } else if (voiceStart !== null && time - lastVoice >= 380) {
      const shouldReply = lastVoice - voiceStart >= 95;
      voiceStart = null;
      if (shouldReply) {
        const duration = input.rustle();
        if (duration) treeMotion.reply(duration);
      }
    }
  },
});
const touchCanvas = document.getElementById('tree');
let treePointer = null, treeKey = null;
touchCanvas.addEventListener('pointerdown', event => {
  if (event.button !== 0 || treePointer !== null || treeKey !== null
      || !treeMotion.pressAt?.(event.clientX, event.clientY)) return;
  event.preventDefault();
  treePointer = event.pointerId;
  touchCanvas.setPointerCapture(treePointer);
});
function finishTreePointer(event) {
  if (event.pointerId !== treePointer) return;
  treePointer = null;
  const cancelled = event.type !== 'pointerup';
  treeMotion.releaseTouch(cancelled);
  if (!cancelled) input.touchRustle();
}
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  touchCanvas.addEventListener(type, finishTreePointer);
}
touchCanvas.addEventListener('contextmenu', event => {
  if (treePointer !== null) event.preventDefault();
});
touchCanvas.addEventListener('keydown', event => {
  if ((event.key !== ' ' && event.key !== 'Enter') || treePointer !== null) return;
  event.preventDefault();
  if (event.repeat || treeKey !== null) return;
  const bounds = touchCanvas.getBoundingClientRect();
  if (treeMotion.pressAt?.(bounds.left + bounds.width / 2, bounds.top + bounds.height * .45)) {
    treeKey = event.key;
  }
});
touchCanvas.addEventListener('keyup', event => {
  if (event.key !== treeKey) return;
  event.preventDefault();
  treeKey = null;
  treeMotion.releaseTouch(false);
  input.touchRustle();
});
touchCanvas.addEventListener('blur', () => {
  if (treeKey === null) return;
  treeKey = null;
  treeMotion.releaseTouch(true);
});
let pointer = null, heldKey = null;
function beginHold() {
  input.start();
}
function endHold(allowReply) {
  const shouldReply = allowReply && voiceStart !== null && lastVoice - voiceStart >= 95;
  const remaining = input.release(shouldReply);
  if (shouldReply && remaining > 0) treeMotion.reply(remaining);
}
micButton.addEventListener('pointerdown', event => {
  if (event.button !== 0 || pointer !== null || heldKey !== null) return;
  event.preventDefault();
  pointer = event.pointerId;
  micButton.setPointerCapture(pointer);
  beginHold();
});
function finishPointer(event) {
  if (event.pointerId !== pointer) return;
  pointer = null;
  endHold(event.type === 'pointerup');
}
micButton.addEventListener('pointerup', finishPointer);
micButton.addEventListener('pointercancel', finishPointer);
micButton.addEventListener('lostpointercapture', finishPointer);
micButton.addEventListener('contextmenu', event => event.preventDefault());
micButton.addEventListener('keydown', event => {
  if (event.key !== ' ' && event.key !== 'Enter') return;
  event.preventDefault();
  if (event.repeat || pointer !== null || heldKey !== null) return;
  heldKey = event.key;
  beginHold();
});
micButton.addEventListener('keyup', event => {
  if (event.key !== heldKey) return;
  event.preventDefault();
  heldKey = null;
  endHold(true);
});
micButton.addEventListener('blur', () => {
  if (heldKey === null) return;
  heldKey = null;
  endHold(false);
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (treePointer !== null || treeKey !== null) treeMotion.releaseTouch(true);
  treePointer = null;
  treeKey = null;
  pointer = null;
  heldKey = null;
  input.release();
});
</script>
</body>
</html>
