<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>올림픽공원 말랑 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Jua = 지도 제목·랜드마크 이름 / Gaegu(손글씨) = 구역 이름 (꽃 상세 이름표와 같은 글씨) -->
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
 html,body{margin:0;height:100%}
 body{background:#ece6d9;color:#3f3a33;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;transition:opacity .35s;overflow:hidden}
 body.leaving{opacity:0}
 /* 길게 눌러도 글자 선택·확대·메뉴가 뜨지 않게 (구역을 꾹 누르는 화면이라서). 소개 카드 글은 선택 가능 */
 body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
 #zone-card .desc{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
 /* 모바일 지도 한 장: 휴대폰에서는 화면 가득, 컴퓨터에서는 휴대폰 폭으로 가운데 (양옆은 바탕색만) */
 .stage{position:relative;width:min(100vw,460px);height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:#d9e8c8}
 /* 지도 전체가 항상 보이게(meet) 맞추고, 남는 공간은 지도 밖까지 그려 둔 잔디 배경이 채움(overflow visible) */
 .stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
 /* 제목·소개: 지도 위에 겹쳐서, 위쪽은 바탕색으로 부드럽게 */
 .intro{position:absolute;z-index:2;left:0;right:0;top:0;box-sizing:border-box;padding:18px 18px 28px;
   background:linear-gradient(#d9e8c8 62%,rgba(217,232,200,0));pointer-events:none}
 /* 제목·첫 줄도 손글씨(Gaegu 굵게). 손글씨는 같은 크기면 작아 보여서 키움 (제목 24→30px, 첫 줄 15→18px) */
 .intro h1{margin:0;font-family:'Gaegu','Apple SD Gothic Neo',sans-serif;font-size:30px;font-weight:700;line-height:1.2;color:#3d5a35}
 .intro p{margin:6px 0 0;font-size:15px;line-height:1.5;color:#6b665c}
 .intro .hand-line{font-family:'Gaegu','Apple SD Gothic Neo',sans-serif;font-weight:700;font-size:18px}
 .intro b{color:#e5566f}
 /* '식물 구역': 지도 구역 이름과 같은 손글씨(Gaegu 굵게). 같은 크기면 작아 보여서 3px 키움. 글자별 삐뚤기는 아래 스크립트가 넣음 */
 .intro .hand{font-family:'Gaegu','Apple SD Gothic Neo',sans-serif;font-weight:700;font-size:18px}
 .intro .hand span{display:inline-block;white-space:pre;margin-right:-0.08em} /* 손글씨는 글자 사이가 넓어서 살짝 좁힘 */
 .intro .hand span.gap{margin-right:-0.2em} /* 띄어쓰기는 더 좁힘 */
 /* 구역 소개 카드: 준비 중인 구역을 누르면 아래에서 올라옴 */
 #zone-card{position:fixed;left:50%;bottom:20px;width:min(360px,calc(100vw - 32px));box-sizing:border-box;
   background:#fffaf2;border:1px solid #e6dcc8;border-radius:18px;padding:14px 44px 14px 16px;
   box-shadow:0 10px 30px rgba(60,50,30,.16);transform:translateX(-50%) translateY(calc(100% + 30px));
   transition:transform .35s cubic-bezier(.2,1.3,.4,1);z-index:10}
 #zone-card.show{transform:translateX(-50%) translateY(0)}
 #zone-card .head{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
 #zone-card .icon{font-size:22px}
 #zone-card .scenic{font-size:11px;font-weight:700;color:#3d5a35;background:#e3efd6;border-radius:999px;padding:2px 8px}
 #zone-card .desc{margin:6px 0 8px;font-size:14px;line-height:1.55;color:#4a463f}
 #zone-card .soon{font-size:12px;color:#9a958c}
 #zone-card .close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:none;font-size:20px;color:#9a958c;cursor:pointer}
</style></head><body>
<div class="stage">
<header class="intro">
  <h1>올림픽공원 말랑 지도</h1>
  <p><span class="hand-line">공원에선 눈으로만 👀 여기선 손으로 마음껏 🤲</span><br><b><span class="hand">식물 구역</span> 을 눌러 보세요.</b></p>
</header>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid meet" font-family="'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <!--
    올림픽공원 일러스트 지도 v0.4 — 휴대폰 세로 한 장, 말랑 클레이 스타일 (2026-11-15)
    - 실제 지도를 따라 그린 것이 아니라, 구역의 대략적인 상대 위치(북쪽이 위)만 참고한 일러스트입니다.
    - 클레이 느낌 = 빛이 드는 왼쪽 위는 밝고 오른쪽 아래는 어두운 그라데이션 + 부드러운 그림자 + 작은 하이라이트.
    - 누를 수 있는 구역은 <g class="zone" data-zone="..."> 입니다. <g class="landmark">는 누를 수 없는 장식.
  -->
  <defs>
    <!-- 그림자 두 종류. 지금은 꺼 둠(flood-opacity 0, 나중에 고려). 켜려면 soft 0.20, softSmall 0.22 -->
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4a4238" flood-opacity="0"/>
    </filter>
    <filter id="softSmall" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#4a4238" flood-opacity="0"/>
    </filter>
    <!-- 점토 재질: 왼쪽 위 밝게 → 오른쪽 아래 어둡게 -->
    <radialGradient id="clayGround" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#f1efea"/><stop offset="1" stop-color="#dedbd3"/></radialGradient>
    <radialGradient id="clayHill" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#c3e2a6"/><stop offset=".65" stop-color="#9fcc82"/><stop offset="1" stop-color="#86b86c"/></radialGradient>
    <radialGradient id="clayLeaf" cx="30%" cy="25%" r="75%"><stop offset="0" stop-color="#7fc06b"/><stop offset="1" stop-color="#3f7f38"/></radialGradient>
    <radialGradient id="clayTrunk" cx="30%" cy="30%" r="80%"><stop offset="0" stop-color="#b07a52"/><stop offset="1" stop-color="#7a4c2e"/></radialGradient>
    <radialGradient id="clayLav" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#f1e9fa"/><stop offset="1" stop-color="#d4c4ea"/></radialGradient>
    <radialGradient id="clayCream" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#fdeccc"/><stop offset="1" stop-color="#ecc88d"/></radialGradient>
    <radialGradient id="clayPinkGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fde3e7"/><stop offset="1" stop-color="#f7c3cc"/></radialGradient>
    <radialGradient id="clayRose" cx="32%" cy="28%" r="80%"><stop offset="0" stop-color="#f58a9d"/><stop offset="1" stop-color="#c9334f"/></radialGradient>
    <linearGradient id="clayWater" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe6f3"/><stop offset="1" stop-color="#86c4dd"/></linearGradient>
    <radialGradient id="clayPath" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fbf3df"/><stop offset="1" stop-color="#e8d7b4"/></radialGradient>
    <radialGradient id="claySkin" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#ffdcc6"/><stop offset="1" stop-color="#e6a685"/></radialGradient>
    <!-- 구역 이름 그림자: 글자를 아래로 2px 옮긴 "같은 색" 복사본을 연하게(28%) 살짝 흐리게 깔아서 도톰하게 -->
    <filter id="labelShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feOffset in="SourceGraphic" dy="2" result="moved"/>
      <feGaussianBlur in="moved" stdDeviation="0.6" result="blurred"/>
      <feComponentTransfer in="blurred" result="faint"><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode in="faint"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경: 아주 연한 연두 한 색 (공원 전체가 잔디. 성내천 풀길·몽촌토성 언덕보다는 연하게 해서 구분) (안내도처럼 건물·광장 구역은 회색, 가운데 몽촌토성 언덕만 초록). 얼룩·그라데이션 없음 -->
  <rect x="-200" y="-100" width="790" height="1044" fill="#d9e8c8"/>

  <!-- (산책로 장식 2줄은 2026-11-16 사용자 피드백으로 뺌) -->

  <!-- 성내천 양옆 풀길: 물길과 같은 선을 더 굵게 그려 물가를 잔디로 감쌈 (배경이라 누를 수 없음).
       물길(성내천 구역)을 누르면 이 풀길도 같이 출렁임 → 아래 script의 data-jelly-with 참고 -->
  <g id="stream-grass" aria-hidden="true" fill="none" stroke-linecap="round">
    <path d="M38 428 C 22 398, 20 350, 22 300 C 23 270, 28 255, 28 245 C 28 180, 36 150, 85 143 C 130 138, 165 160, 220 160 C 250 160, 265 160, 280 150 C 296 138, 348 132, 348 175 L348 215 C 348 248, 366 252, 366 282 C 366 305, 357 318, 359 340 C 361 365, 371 372, 371 398 C 371 420, 362 428, 364 450 C 366 478, 368 496, 355 509" stroke="#b3d494" stroke-width="36"/>
    <path d="M38 428 C 22 398, 20 350, 22 300 C 23 270, 28 255, 28 245 C 28 180, 36 150, 85 143 C 130 138, 165 160, 220 160 C 250 160, 265 160, 280 150 C 296 138, 348 132, 348 175 L348 215 C 348 248, 366 252, 366 282 C 366 305, 357 318, 359 340 C 361 365, 371 372, 371 398 C 371 420, 362 428, 364 450 C 366 478, 368 496, 355 509" stroke="#c6e2aa" stroke-width="28"/>
  </g>

  <!-- 몽촌토성 언덕: 공원 가운데~서쪽의 큰 토성 (지형 배경. 누르는 자리는 아래 '구역들'의 몽촌토성 산책로가 맡음.
       산책로를 누르면 이 언덕도 함께 출렁임 → 아래 script의 data-jelly-with 참고) -->
  <g id="tosung-hill" aria-hidden="true">
    <path d="M60 330 C 55 230, 140 175, 220 182 C 290 188, 305 260, 300 340 C 296 430, 290 520, 230 572 C 175 610, 85 590, 68 510 C 55 450, 62 390, 60 330 Z"
          fill="url(#clayHill)" filter="url(#soft)"/>
    <path d="M86 300 C 92 240, 150 205, 205 210" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ============ 배경 건물들 (장식, 누를 수 없음, 이름표 없음) ============
       ⚠️ 전부 프로토타입용 임시 건물. 실제 올림픽공원 건물·위치와 맞춘 게 아님 (이름도 "배경 건물 N" 번호만).
       빈 공간을 공원 분위기로 채우려고 흰 건물 + 연한 지붕 + 하늘색 유리로 모양만 다양하게 둠.
       공모전 이후 안내도를 보고 디테일화할 때 바꾸거나 지울 것 (data-temp="true"로 한 번에 찾을 수 있음).
       랜드마크·구역보다 뒤에 그려서 항상 아래에 깔림 -->
  <g class="bg-buildings" aria-hidden="true" opacity=".8">
    <!-- 건물마다 작은 묶음(g) 하나. 안의 도형 숫자는 그 건물 가운데(0,0) 기준이고,
         지도 위 자리는 translate(x y) 숫자 하나로 정함 → 건물을 옮길 땐 이 숫자만 바꾸면 됨 -->
    <!-- 배경 건물 1: 키 큰 층층 건물 -->
    <g data-name="배경 건물 1" data-temp="true" transform="translate(15 512)">
      <rect x="-9" y="-20" width="18" height="40" rx="4" fill="#f5f2ec"/>
      <path d="M -6 -10 h 12 M -6 -2 h 12 M -6 6 h 12" stroke="#d3dde3" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- 배경 건물 2: 둥근 탑 둘 -->
    <g data-name="배경 건물 2" data-temp="true" transform="translate(42 518)">
      <rect x="-12" y="-14" width="12" height="28" rx="6" fill="#ebe6dd"/>
      <rect x="2" y="-6" width="11" height="20" rx="5.5" fill="#f5f2ec"/>
    </g>
    <!-- 배경 건물 3: 깃대 줄 + 깃대 밑 작은 타원 광장 (자리가 좁아 광장을 깃대 바로 밑으로 붙여 줄임) -->
    <g data-name="배경 건물 3" data-temp="true" transform="translate(36 661)">
      <ellipse cx="2" cy="-4" rx="27" ry="7" fill="#ebe6dd"/>
      <path d="M -20 -4 v -12 M -10 -4 v -12 M 0 -4 v -12 M 10 -4 v -12 M 20 -4 v -12" stroke="#f5f2ec" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -20 -16 h 5 M -10 -16 h 5 M 0 -16 h 5 M 10 -16 h 5 M 20 -16 h 5" stroke="#d3dde3" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- 배경 건물 4: 작은 조각 기둥 셋 -->
    <g data-name="배경 건물 4" data-temp="true" transform="translate(82 676)">
      <rect x="-16" y="-8" width="8" height="20" rx="4" fill="#f5f2ec"/>
      <circle cx="2" cy="4" r="7" fill="#ebe6dd"/>
      <rect x="10" y="-12" width="7" height="24" rx="3.5" fill="#f5f2ec"/>
    </g>
    <!-- 배경 건물 5: 네모 건물 셋이 모인 단지 -->
    <g data-name="배경 건물 5" data-temp="true" transform="translate(36 680)">
      <rect x="-22" y="-16" width="22" height="18" rx="4" fill="#f5f2ec"/>
      <rect x="2" y="-10" width="20" height="24" rx="4" fill="#ebe6dd"/>
      <rect x="-18" y="4" width="18" height="12" rx="3" fill="#f5f2ec"/>
    </g>
    <!-- 배경 건물 6: 납작한 직사각형 -->
    <g data-name="배경 건물 6" data-temp="true" transform="translate(214 710)">
      <rect x="-20" y="-10" width="40" height="20" rx="5" fill="#f5f2ec"/>
      <rect x="-16" y="-6" width="32" height="5" rx="2.5" fill="#d3dde3"/>
    </g>
    <!-- 배경 건물 7: 반달 아치 지붕 -->
    <g data-name="배경 건물 7" data-temp="true" transform="translate(254 586)">
      <path d="M -20 6 L -20 -6 A 20 16 0 0 1 20 -6 L 20 6 Z" fill="#f5f2ec"/>
      <path d="M -12 6 L -12 -2 A 12 9 0 0 1 12 -2 L 12 6 Z" fill="#ebe6dd"/>
    </g>
    <!-- 배경 건물 8: 둥글게 휜 곡선 건물 -->
    <g data-name="배경 건물 8" data-temp="true" transform="translate(87 708)">
      <path d="M -25 18 C -27 -4 -9 -18 17 -16 C 25 -15 27 -8 19 -6 C 1 -6 -9 4 -9 18 Z" fill="#f5f2ec"/>
    </g>
    <!-- 배경 건물 9: 낮은 네모 둘 -->
    <g data-name="배경 건물 9" data-temp="true" transform="translate(304 544)">
      <rect x="-40" y="-7" width="44" height="16" rx="5" fill="#f5f2ec"/>
      <rect x="10" y="-11" width="30" height="22" rx="5" fill="#ebe6dd"/>
    </g>
    <!-- 배경 건물 10: 길고 낮은 네모 + 유리창 띠 -->
    <g data-name="배경 건물 10" data-temp="true" transform="translate(38 754)">
      <rect x="-26" y="-9" width="52" height="18" rx="5" fill="#f5f2ec"/>
      <rect x="-21" y="-4" width="42" height="5" rx="2.5" fill="#d3dde3"/>
    </g>
    <!-- 배경 건물 11: 키 큰 네모 + 층 줄 -->
    <g data-name="배경 건물 11" data-temp="true" transform="translate(104 762)">
      <rect x="-11" y="-18" width="22" height="36" rx="4" fill="#ebe6dd"/>
      <path d="M -7 -10 h 14 M -7 -2 h 14 M -7 6 h 14" stroke="#d3dde3" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- 배경 건물 12: 작은 둥근 지붕 -->
    <g data-name="배경 건물 12" data-temp="true" transform="translate(28 794)">
      <circle cx="0" cy="0" r="13" fill="#f5f2ec"/>
      <circle cx="0" cy="0" r="6" fill="#ebe6dd"/>
    </g>
    <!-- 배경 건물 13: ㄱ자로 붙은 네모 둘 -->
    <g data-name="배경 건물 13" data-temp="true" transform="translate(70 800)">
      <rect x="-14" y="-10" width="28" height="18" rx="4" fill="#f5f2ec"/>
      <rect x="4" y="-2" width="18" height="16" rx="4" fill="#ebe6dd"/>
    </g>
    <!-- 배경 건물 14: 작은 아치 지붕 -->
    <g data-name="배경 건물 14" data-temp="true" transform="translate(118 806)">
      <path d="M -14 8 L -14 -1 A 14 11 0 0 1 14 -1 L 14 8 Z" fill="#f5f2ec"/>
      <path d="M -7 8 L -7 3 A 7 5 0 0 1 7 3 L 7 8 Z" fill="#ebe6dd"/>
    </g>
    <!-- 배경 건물 15: 흰 돔 -->
    <g data-name="배경 건물 15" data-temp="true" transform="translate(322 577)">
      <path d="M -20 -1 A 20 18 0 0 1 20 -1 Z" fill="#f5f2ec"/>
      <rect x="-22" y="-3" width="44" height="6" rx="3" fill="#ebe6dd"/>
    </g>
    <!-- 배경 건물 16: 네모 상자 -->
    <g data-name="배경 건물 16" data-temp="true" transform="translate(322 598)">
      <rect x="-18" y="-10" width="36" height="20" rx="4" fill="#f5f2ec"/>
      <rect x="-18" y="-10" width="36" height="6" rx="3" fill="#ebe6dd"/>
    </g>
    <!-- 배경 건물 17: 납작한 코트 -->
    <g data-name="배경 건물 17" data-temp="true" transform="translate(368 588)">
      <rect x="-16" y="-8" width="32" height="16" rx="4" fill="#ebe6dd"/>
      <rect x="-10" y="-4" width="20" height="8" rx="2" fill="#d3dde3"/>
    </g>
    <!-- 배경 건물 18: 둥근 지붕 -->
    <g data-name="배경 건물 18" data-temp="true" transform="translate(365 614)">
      <circle cx="0" cy="0" r="15" fill="#f5f2ec"/>
      <circle cx="0" cy="0" r="8" fill="#ebe6dd"/>
    </g>
  </g>

  <!-- ============ 랜드마크 5개 (장식용, 누를 수 없음) ============

    #zone-rose       .zone-label { fill: #a82340; }  /* 장미: 점토 장미의 진한 줄 색 */
    #zone-stream     .zone-label { fill: #2f7898; }  /* 성내천: 물 색을 진하게 */
    #zone-lonetree   .zone-label { fill: #2b5e27; }  /* 나홀로나무: 잎 색을 진하게 (초록 언덕 위라 더 어둡게) */
    #zone-wildlab    .zone-label { fill: #6a4fa0; }  /* 야생화학습장: 라벤더 꽃 색을 진하게 */
    #zone-wildflower .zone-label { fill: #b8661a; }  /* 들꽃마루: 주황 들꽃 색을 진하게 */

    .zone[data-active="false"] { opacity: .9; transition: opacity .25s; }

    @keyframes pulse { 0%,100% { opacity: .6; transform: scale(1);} 50% { opacity: 1; transform: scale(1.08);} }

</div>
<aside id="zone-card" aria-live="polite">
  <button class="close" aria-label="닫기">×</button>
  <div class="head"><span class="icon"></span><span class="name"></span><span class="scenic"></span></div>
  <p class="desc"></p>
  <div class="soon"><span class="soon-icon">🫧</span> <span class="soon-text"></span></div>
</aside>
<!-- 구역 연결표는 js/zones.js 한 곳에서 관리 (인터랙션 페이지와 공유) -->
<script src="js/zones.js"></script>
<script>
const svg = document.querySelector('svg');
// 지도를 길게 누를 때 브라우저 기본 동작(글자 선택, 메뉴) 막기
svg.addEventListener('contextmenu', e => e.preventDefault());
svg.addEventListener('selectstart', e => e.preventDefault());

// ------------------------------------------------------------
// 구역 이름을 손으로 쓴 것처럼: 글자마다 조금씩 다르게 기울이고 위아래로 들쭉날쭉하게
//   SVG <text>는 글자별 값을 목록으로 받는다
//     rotate="a1 a2 a3 …"  → 글자 하나하나를 각자 기울임 (도)
//     dy="d1 d2 d3 …"      → 글자를 위아래로 옮김. 단, "앞 글자 기준" 이동이라
//                            원하는 높이 h에서 앞 글자 높이를 빼서 넣음 (dy = h - 앞 h)
//   값은 이름에서 만든 고정 난수라 새로고침해도 모양이 그대로다
// ------------------------------------------------------------
function nameRandom(text) { // 이름 → 0~1 사이 난수를 차례로 주는 함수 (같은 이름이면 늘 같은 순서)
  let h = 2166136261;
  for (const ch of text) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13; return ((h >>> 0) % 10000) / 10000; };
}
document.querySelectorAll('.zone-label').forEach(label => {
  const chars = [...label.textContent];
  const rand = nameRandom(label.textContent);
  const angles = chars.map(() => ((rand() * 2 - 1) * 4).toFixed(1));   // 글자마다 -4° ~ +4°
  const heights = chars.map(() => (rand() * 2 - 1) * 1.6);            // 글자마다 -1.6 ~ +1.6px 위아래
  const dys = heights.map((h, i) => (h - (i ? heights[i - 1] : 0)).toFixed(1));
  // dx = 글자를 왼쪽(-)으로 당기는 값 (앞 글자 기준). 손글씨는 글자 사이가 넓어서 1.2px, 띄어쓰기는 3px 당김
  const dxs = chars.map((ch, i) => i === 0 ? 0 : (ch === ' ' || chars[i - 1] === ' ' ? -1.5 : -1.2));
  label.setAttribute('rotate', angles.join(' '));
  label.setAttribute('dy', dys.join(' '));
  label.setAttribute('dx', dxs.join(' '));
});
// 위 안내 문구의 '식물 구역'도 같은 방식으로 (HTML 글자라서 글자마다 <span>으로 나눠 transform으로 기울이고 올림)
document.querySelectorAll('.intro .hand').forEach(el => {
  const text = el.textContent;
  const rand = nameRandom(text);
  el.textContent = '';                                   // 비우고 글자 하나씩 다시 넣기
  for (const ch of text) {
    const span = document.createElement('span');
    span.textContent = ch;
    if (ch === ' ') span.className = 'gap';
    const angle = (rand() * 2 - 1) * 4;                  // -4° ~ +4°
    const up = (rand() * 2 - 1) * 1.6;                   // -1.6 ~ +1.6px
    span.style.transform = `translateY(${up.toFixed(1)}px) rotate(${angle.toFixed(1)}deg)`;
    el.appendChild(span);
  }
});
// 구역 소개 카드: 내용은 js/zones.js의 icon · name · scenic · intro 에서 가져옴
const card = document.getElementById('zone-card');
function showCard(conf, fallbackName) {
  card.querySelector('.icon').textContent = (conf && conf.icon) || '';
  card.querySelector('.name').textContent = (conf && conf.name) || fallbackName;
  const scenic = card.querySelector('.scenic');
  scenic.textContent = (conf && conf.scenic) || '';
  scenic.style.display = scenic.textContent ? '' : 'none';
  card.querySelector('.desc').textContent = (conf && conf.intro) || '';
  // 준비 중 한마디: 구역마다 다르게 (없으면 기본 문구)
  card.querySelector('.soon-text').textContent = (conf && conf.soon) || '말랑이를 열심히 빚고 있어요…';
  card.classList.add('show');
}
function hideCard() { card.classList.remove('show'); }
card.querySelector('.close').addEventListener('click', hideCard);
// 카드 밖(구역이 아닌 곳)을 누르면 닫힘
document.addEventListener('pointerdown', e => {
  if (!card.contains(e.target) && !e.target.closest('.zone')) hideCard();
});

// ------------------------------------------------------------
// 젤리 구역: 각 구역에 작은 용수철을 달아 둔다.
//   마우스 올림 → 살짝 출렁 / 누름 → 납작하게 눌림 / 놓음 → 통 튀며 출렁
//   a = 찌그러진 정도 (+ 옆으로 넓적, - 위로 길쭉), 0이면 원래 모양
// ------------------------------------------------------------
const jellies = [];
function makeJelly(el) {
  const box = el.getBBox();
  // data-jelly-target="id": 구역 자신 대신 그 묶음을 출렁이게 (몽촌토성 산책로 → 언덕 위 구역 묶음 전체)
  const target = el.dataset.jellyTarget ? document.getElementById(el.dataset.jellyTarget) : el;
  const j = { el: target, cx: box.x + box.width / 2, cy: box.y + box.height, a: 0, v: 0, target: 0 }; // 바닥 가운데를 기준으로 찌그러짐
  // data-jelly-with="id": 구역 밖에 따로 그린 짝꿍(예: 성내천 풀길)도 같은 모양으로 함께 출렁이게
  j.buddy = el.dataset.jellyWith ? document.getElementById(el.dataset.jellyWith) : null;
  jellies.push(j);
  return j;
}
let jellyRunning = false;
function jellyLoop() {
  let moving = false;
  jellies.forEach(j => {
    j.v += (300 * (j.target - j.a) - 9 * j.v) / 60;  // 용수철 힘 - 흔들림 줄이는 힘
    j.a += j.v / 60;
    if (Math.abs(j.v) > 0.0005 || Math.abs(j.target - j.a) > 0.0005) moving = true;
    const sx = 1 + j.a, sy = 1 - j.a;
    const tf = `translate(${j.cx} ${j.cy}) scale(${sx} ${sy}) translate(${-j.cx} ${-j.cy})`;
    j.el.setAttribute('transform', tf);
    if (j.buddy) j.buddy.setAttribute('transform', tf);
  });
  jellyRunning = moving;
  if (moving) requestAnimationFrame(jellyLoop);
}
function poke(j, dv, target) {
  j.v += dv;
  if (target !== undefined) j.target = target;
  if (!jellyRunning) { jellyRunning = true; requestAnimationFrame(jellyLoop); }
}

// ------------------------------------------------------------
// 장미광장처럼 데이터가 있는 구역: 그 자리로 확대되면서 다음 화면으로
// (viewBox = SVG에서 "어디를 얼마나 크게 볼지" 정하는 창. 이걸 좁히면 확대)
// ------------------------------------------------------------
const FULL_VIEW = [0, 0, 390, 844];
function zoomInto(j, done) {
  const to = [j.cx - 70, j.cy - 120, 140, 303]; // 구역 주변 (지도와 같은 세로 비율)
  const start = performance.now(), dur = 750;
  (function step(now) {
    const t = Math.min(1, (now - start) / dur);
    if (t > 0.55) document.body.classList.add('leaving'); // 확대가 반쯤 보인 뒤에 흐려지기 시작
    const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // 천천히-빠르게-천천히
    svg.setAttribute('viewBox', FULL_VIEW.map((v, i) => v + (to[i] - v) * e).join(' '));
    if (t < 1) requestAnimationFrame(step); else done();
  })(start);
}
// 뒤로가기로 돌아왔을 때 확대된 상태가 남아 있지 않게 되돌리기
window.addEventListener('pageshow', () => {
  svg.setAttribute('viewBox', FULL_VIEW.join(' '));
  document.body.classList.remove('leaving');
});

function openZone(zoneEl, j){
  const id = zoneEl.dataset.zone, name = zoneEl.dataset.name, conf = findZone(id);
  if (conf && conf.source && j) {
    hideCard();
    zoomInto(j, () => { location.href = 'interaction.html?zone=' + encodeURIComponent(id); });
  } else {
    showCard(conf, name); // 준비 중인 구역: 짧은 소개 카드
  }
}

document.querySelectorAll('.zone').forEach(z => {
  // 연결표 기준으로 활성 표시를 맞춤 (SVG의 data-active를 일일이 고치지 않아도 됨)
  const conf = findZone(z.dataset.zone);
  z.dataset.active = String(!!(conf && conf.source));
  // data-jelly="false"인 구역(몽촌토성 산책로)은 출렁임 없이 누르면 바로 카드만
  if (z.dataset.jelly === 'false') {
    z.addEventListener('click', () => openZone(z, null));
    z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openZone(z, null); } });
    return;
  }
  const j = makeJelly(z);
  z.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') poke(j, 1.2); });
  z.addEventListener('pointerdown', () => poke(j, 0, 0.12));             // 꾹 → 납작
  z.addEventListener('pointerleave', () => { if (j.target) poke(j, 0, 0); });
  z.addEventListener('pointerup', () => poke(j, -2.5, 0));                // 놓음 → 통!
  z.addEventListener('click', () => setTimeout(() => openZone(z, j), 180)); // 출렁임을 살짝 보여준 뒤
  z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(j, -2.5, 0); openZone(z, j); } });
});

</script>
