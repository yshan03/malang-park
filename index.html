<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>올림픽공원 말랑 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Jua = 지도 제목·랜드마크 이름 / Gaegu(손글씨) = 구역 이름 (꽃 상세 이름표와 같은 글씨) -->
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
 html,body{margin:0;height:100%}
 body{background:#ece6d9;color:#3f3a33;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;transition:opacity .35s;overflow:hidden}
 body.leaving{opacity:0}
 /* 길게 눌러도 글자 선택·확대·메뉴가 뜨지 않게 (구역을 꾹 누르는 화면이라서). 소개 카드 글은 선택 가능 */
 body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
 #zone-card .desc{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
 /* 모바일 지도 한 장: 휴대폰에서는 화면 가득, 컴퓨터에서는 휴대폰 폭으로 가운데 (양옆은 바탕색만) */
 .stage{position:relative;width:min(100vw,460px);height:100vh;height:100dvh;margin:0 auto;overflow:hidden;overflow:clip;background:#d9e8c8}
 /* 지도 전체가 항상 보이게(meet) 맞추고, 남는 공간은 지도 밖까지 그려 둔 잔디 배경이 채움(overflow visible) */
 .stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
 /* 제목·소개: 지도 위에 겹쳐서, 위쪽은 바탕색으로 부드럽게 */
 .intro{position:absolute;z-index:2;left:0;right:0;top:0;box-sizing:border-box;padding:18px 18px 28px;
   background:linear-gradient(#d9e8c8 62%,rgba(217,232,200,0));pointer-events:none}
 /* 제목·첫 줄도 손글씨(Gaegu 굵게). 손글씨는 같은 크기면 작아 보여서 키움 (제목 24→30px, 첫 줄 15→18px) */
 .intro h1{margin:0;font-family:'Gaegu','Apple SD Gothic Neo',sans-serif;font-size:30px;font-weight:700;line-height:1.2;color:#3d5a35}
 .intro p{margin:6px 0 0;font-size:15px;line-height:1.5;color:#6b665c}
 .intro .hand-line{font-family:'Gaegu','Apple SD Gothic Neo',sans-serif;font-weight:700;font-size:18px}
 .intro b{color:#e5566f}
 /* '식물 구역': 지도 구역 이름과 같은 손글씨(Gaegu 굵게). 같은 크기면 작아 보여서 3px 키움. 글자별 삐뚤기는 아래 스크립트가 넣음 */
 .intro .hand{font-family:'Gaegu','Apple SD Gothic Neo',sans-serif;font-weight:700;font-size:18px}
 .intro .hand span{display:inline-block;white-space:pre;margin-right:-0.08em} /* 손글씨는 글자 사이가 넓어서 살짝 좁힘 */
 .intro .hand span.gap{margin-right:-0.2em} /* 띄어쓰기는 더 좁힘 */
 /* 구역 소개 카드: 준비 중인 구역을 누르면 아래에서 올라옴 */
 #zone-card{position:absolute;left:50%;bottom:20px;width:min(360px,calc(100% - 32px));
   max-height:calc(100% - 40px);overflow-y:auto;box-sizing:border-box;
   background:#fffaf2;border:1px solid #e6dcc8;border-radius:18px;padding:14px 44px 14px 16px;
   box-shadow:0 10px 30px rgba(60,50,30,.16);transform:translateX(-50%) translateY(calc(100% + 30px));
   transition:transform .35s cubic-bezier(.2,1.3,.4,1);z-index:10}
 #zone-card.show{transform:translateX(-50%) translateY(0)}
 #zone-card .head{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
 #zone-card .icon{font-size:22px}
 #zone-card .scenic{font-size:11px;font-weight:700;color:#3d5a35;background:#e3efd6;border-radius:999px;padding:2px 8px}
 #zone-card .desc{margin:6px 0 8px;font-size:14px;line-height:1.55;color:#4a463f}
 #zone-card .soon{font-size:12px;color:#9a958c}
 #zone-card .close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:none;font-size:20px;color:#9a958c;cursor:pointer}

  /* 녹지 윤곽 검토용. SVG의 data-outline-preview를 지우면 숨긴 요소가 돌아옴. */
  svg[data-outline-preview] :is(
    #zone-lonetree, #zone-wildlab, #tosung-hill > path
  ) {
    display: none;
  }

  .landmark-label { display: none; }

  /* 공원·성내천·88호수의 위치 관계를 유지하며 함께 확대 */
  .map-core-scale { transform: translate(-19.5px, -48px) scale(1.19); }

  html.mobile-preview body {
    display: grid; place-items: center; background: #ece9e0;
    height: var(--preview-visible-height, 100dvh);
  }
  html.mobile-preview .stage {
    width: 390px;
    height: 844px;
    zoom: var(--preview-scale, 1);
    border-radius: 14px;
    box-shadow: 0 0 0 1px #66725e40, 0 8px 20px #26312020;
  }

  .label-color-review {
    position: absolute; z-index: 3; left: 16px; bottom: 126px;
    padding: 10px 12px; border-radius: 12px; background: #f7faef;
    color: #3c5040; font-size: 13px;
  }
  .label-color-review .swatches { display: flex; gap: 7px; margin-bottom: 8px; }
  .label-color-review button {
    width: 29px; height: 29px; padding: 0; border: 2px solid #f7faef;
    border-radius: 50%; background: var(--swatch); cursor: pointer;
  }
  .label-color-review button[aria-pressed="true"] { outline: 2px solid #556957; }
  .label-color-review output { display: block; font-weight: 700; }

  [data-trail-variant] { display: none; }
  svg[data-trail-review] .tosung-path > :not([data-trail-variant]) { display: none; }
  svg[data-trail-review="ribbon"] [data-trail-variant="ribbon"],
  svg[data-trail-review="stitch"] [data-trail-variant="stitch"],
  svg[data-trail-review="leaf"] [data-trail-variant="leaf"],
  svg[data-trail-review="stones"] [data-trail-variant="stones"] { display: inline; }
  svg[data-trail-review="current"] .tosung-path > :not([data-trail-variant]),
  svg[data-trail-review][data-trail-plants] :is(#zone-lonetree, #zone-wildlab) { display: inline; }
  .map-review {
    position: absolute; z-index: 3; left: 14px; top: 586px; width: 234px;
    padding: 10px; box-sizing: border-box; border-radius: 12px; background: #f7faef;
    display: flex; flex-wrap: wrap; gap: 5px;
  }
  .map-review button {
    background: #e5edd9; color: #455340; font: 700 14px system-ui, sans-serif;
    border: 1px solid transparent; border-radius: 8px; padding: 7px 9px; cursor: pointer;
  }
  .map-review button[aria-pressed="true"] { background: #557052; color: #fff; }
  .map-review button:focus-visible { outline: 2px solid #435841; outline-offset: 1px; }

  [data-tree-variant] { display: none; }
  svg[data-outline-preview]:not([data-trail-review]) #zone-lonetree { display: inline; }
  svg:not([data-tree-review]) [data-tree-variant="paper"],
  svg[data-tree-review="clay"] [data-tree-variant="clay"],
  svg[data-tree-review="puffs"] [data-tree-variant="puffs"],
  svg[data-tree-review="paper"] [data-tree-variant="paper"] { display: inline; }

  [data-rose-jar] { display: none; }
  svg:not([data-rose-review]) [data-rose-jar="open"] { display: inline; }
  svg[data-rose-review="paper"] [data-rose-jar="paper"],
  svg[data-rose-review="lean"] [data-rose-jar="lean"],
  svg[data-rose-review="open"] [data-rose-jar="open"] { display: inline; }

  [data-garden-art] { display: none; }
  svg[data-outline-preview]:not([data-trail-review]) #zone-wildlab { display: inline; }
  svg:not([data-gardens-review]) :is([data-garden-art="wind"], [data-garden-art="muhly"]),
  svg[data-dulkkot="wind"] [data-garden-art="wind"],
  svg[data-dulkkot="waves"] [data-garden-art="waves"],
  svg[data-wildlab="plot"] [data-garden-art="plot"],
  svg[data-wildlab="lens"] [data-garden-art="lens"],
  svg[data-wildlab="muhly"] [data-garden-art="muhly"] { display: inline; }
  .garden-review { display: grid; gap: 6px; }
  .garden-review button { font-size: 12px; padding: 7px 6px; }
  .garden-review [role="group"] { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
  .garden-review strong { flex-basis: 100%; color: #455340; font: 700 12px system-ui, sans-serif; }
</style>
<script>
  if (new URLSearchParams(location.search).get('mobile') === '1') {
    const root = document.documentElement;
    root.classList.add('mobile-preview');
    function fitMobilePreview() {
      const width = window.visualViewport?.width ?? innerWidth;
      const height = window.visualViewport?.height ?? innerHeight;
      const scale = Math.min(1, (width - 16) / 390, (height - 16) / 844);
      root.style.setProperty('--preview-visible-height', height + 'px');
      root.style.setProperty('--preview-scale', scale);
    }
    fitMobilePreview();
    addEventListener('resize', fitMobilePreview);
    window.visualViewport?.addEventListener('resize', fitMobilePreview);
  }
</script>

    - 클레이 느낌 = 빛이 드는 왼쪽 위는 밝고 오른쪽 아래는 어두운 그라데이션 + 부드러운 그림자 + 작은 하이라이트.
    - 누를 수 있는 구역은 <g class="zone" data-zone="..."> 입니다. <g class="landmark">의 그림은 누르면 움직입니다.

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4a4238" flood-opacity="0"/>

    <radialGradient id="clayTrunk" cx="30%" cy="30%" r="80%"><stop offset="0" stop-color="#b07a52"/><stop offset="1" stop-color="#7a4c2e"/></radialGradient>
    <radialGradient id="clayLav" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#f1e9fa"/><stop offset="1" stop-color="#d4c4ea"/></radialGradient>
    <radialGradient id="clayCream" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#fdeccc"/><stop offset="1" stop-color="#ecc88d"/></radialGradient>
    <radialGradient id="clayPinkGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fde3e7"/><stop offset="1" stop-color="#f7c3cc"/></radialGradient>
    <radialGradient id="clayRose" cx="32%" cy="28%" r="80%"><stop offset="0" stop-color="#f58a9d"/><stop offset="1" stop-color="#c9334f"/></radialGradient>
    <linearGradient id="clayWater" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bfe6f3"/><stop offset="1" stop-color="#86c4dd"/></linearGradient>
    <radialGradient id="clayPath" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fbf3df"/><stop offset="1" stop-color="#e8d7b4"/></radialGradient>
    <radialGradient id="claySkin" cx="30%" cy="25%" r="80%"><stop offset="0" stop-color="#ffdcc6"/><stop offset="1" stop-color="#e6a685"/></radialGradient>
    <!-- 구역 이름 그림자: 글자를 아래로 2px 옮긴 "같은 색" 복사본을 연하게(28%) 살짝 흐리게 깔아서 도톰하게 -->
    <filter id="labelShadow" x="-10%" y="-20%" width="120%" height="160%">

<!-- 구역 연결표는 js/zones.js 한 곳에서 관리 (인터랙션 페이지와 공유) -->
<script src="js/zones.js?v=cedar-touch"></script>
<script>
const svg = document.querySelector('svg');
// 지도를 길게 누를 때 브라우저 기본 동작(글자 선택, 메뉴) 막기
svg.addEventListener('contextmenu', e => e.preventDefault());
svg.addEventListener('selectstart', e => e.preventDefault());

// ------------------------------------------------------------
// 구역 이름을 손으로 쓴 것처럼: 글자마다 조금씩 다르게 기울이고 위아래로 들쭉날쭉하게
//   SVG <text>는 글자별 값을 목록으로 받는다
//     rotate="a1 a2 a3 …"  → 글자 하나하나를 각자 기울임 (도)
//     dy="d1 d2 d3 …"      → 글자를 위아래로 옮김. 단, "앞 글자 기준" 이동이라
//                            원하는 높이 h에서 앞 글자 높이를 빼서 넣음 (dy = h - 앞 h)
//   값은 이름에서 만든 고정 난수라 새로고침해도 모양이 그대로다
// ------------------------------------------------------------
function nameRandom(text) { // 이름 → 0~1 사이 난수를 차례로 주는 함수 (같은 이름이면 늘 같은 순서)
  let h = 2166136261;
  for (const ch of text) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13; return ((h >>> 0) % 10000) / 10000; };
}
document.querySelectorAll('.zone-label').forEach(label => {
  const chars = [...label.textContent];
  const rand = nameRandom(label.textContent);
  const angles = chars.map(() => ((rand() * 2 - 1) * 4).toFixed(1));   // 글자마다 -4° ~ +4°
  const heights = chars.map(() => (rand() * 2 - 1) * 1.6);            // 글자마다 -1.6 ~ +1.6px 위아래
  const dys = heights.map((h, i) => (h - (i ? heights[i - 1] : 0)).toFixed(1));
  // dx = 글자를 왼쪽(-)으로 당기는 값 (앞 글자 기준). 손글씨는 글자 사이가 넓어서 1.2px, 띄어쓰기는 3px 당김
  const dxs = chars.map((ch, i) => i === 0 ? 0 : (ch === ' ' || chars[i - 1] === ' ' ? -1.5 : -1.2));
  label.setAttribute('rotate', angles.join(' '));
  label.setAttribute('dy', dys.join(' '));
  label.setAttribute('dx', dxs.join(' '));
});
// 위 안내 문구의 '식물 구역'도 같은 방식으로 (HTML 글자라서 글자마다 <span>으로 나눠 transform으로 기울이고 올림)
document.querySelectorAll('.intro .hand').forEach(el => {
  const text = el.textContent;
  const rand = nameRandom(text);
  el.textContent = '';                                   // 비우고 글자 하나씩 다시 넣기
  for (const ch of text) {
    const span = document.createElement('span');
    span.textContent = ch;
    if (ch === ' ') span.className = 'gap';
    const angle = (rand() * 2 - 1) * 4;                  // -4° ~ +4°
    const up = (rand() * 2 - 1) * 1.6;                   // -1.6 ~ +1.6px
    span.style.transform = `translateY(${up.toFixed(1)}px) rotate(${angle.toFixed(1)}deg)`;
    el.appendChild(span);
  }
});
// 구역 소개 카드: 내용은 js/zones.js의 icon · name · scenic · intro 에서 가져옴
const card = document.getElementById('zone-card');
function showCard(conf, fallbackName) {
  card.querySelector('.icon').textContent = (conf && conf.icon) || '';
  card.querySelector('.name').textContent = (conf && conf.name) || fallbackName;
  const scenic = card.querySelector('.scenic');
  scenic.textContent = (conf && conf.scenic) || '';
  scenic.style.display = scenic.textContent ? '' : 'none';
  card.querySelector('.desc').textContent = (conf && conf.intro) || '';
  // 준비 중 한마디: 구역마다 다르게 (없으면 기본 문구)
  card.querySelector('.soon-text').textContent = (conf && conf.soon) || '말랑이를 열심히 빚고 있어요…';
  card.classList.add('show');
}
function hideCard() { card.classList.remove('show'); }
card.querySelector('.close').addEventListener('click', hideCard);
// 카드 밖(구역이 아닌 곳)을 누르면 닫힘
document.addEventListener('pointerdown', e => {
  if (!card.contains(e.target) && !e.target.closest('.zone')) hideCard();
});

// ------------------------------------------------------------
// 젤리 구역: 각 구역에 작은 용수철을 달아 둔다.
//   마우스 올림 → 살짝 출렁 / 누름 → 납작하게 눌림 / 놓음 → 통 튀며 출렁
//   a = 찌그러진 정도 (+ 옆으로 넓적, - 위로 길쭉), 0이면 원래 모양
// ------------------------------------------------------------
const jellies = [];
function makeJelly(el, art) {
  const box = el.getBBox();
  // data-jelly-target="id": 구역 자신 대신 그 묶음을 출렁이게 (몽촌토성 산책로 → 언덕 위 구역 묶음 전체)
  const target = art || (el.dataset.jellyTarget ? document.getElementById(el.dataset.jellyTarget) : el);
  const j = { el: target, cx: box.x + box.width / 2, cy: box.y + box.height, a: 0, v: 0, target: 0 }; // 바닥 가운데를 기준으로 찌그러짐
  // data-jelly-with="id": 구역 밖에 따로 그린 짝꿍(예: 성내천 풀길)도 같은 모양으로 함께 출렁이게
  j.buddy = el.dataset.jellyWith ? document.getElementById(el.dataset.jellyWith) : null;
  jellies.push(j);
  return j;
}
let jellyRunning = false;
function jellyLoop() {
  let moving = false;
  jellies.forEach(j => {
    j.v += (300 * (j.target - j.a) - 9 * j.v) / 60;  // 용수철 힘 - 흔들림 줄이는 힘
    j.a += j.v / 60;
    if (Math.abs(j.v) > 0.0005 || Math.abs(j.target - j.a) > 0.0005) moving = true;
    const motion = j.motion;
    let transform = `scale(${1 + j.a} ${1 - j.a})`;
    if (motion === 'hop') {
      const rise = Math.min(0, j.a) * 74;
      transform = `translate(0 ${rise}) scale(${1 + j.a * .35} ${1 - j.a * .35})`;
    } else if (motion === 'rock') {
      transform = `rotate(${j.a * 66})`;
    }
    const tf = `translate(${j.cx} ${j.cy}) ${transform} translate(${-j.cx} ${-j.cy})`;
    j.el.setAttribute('transform', tf);
    if (j.buddy) j.buddy.setAttribute('transform', tf);
  });
  jellyRunning = moving;
  if (moving) requestAnimationFrame(jellyLoop);
}
function poke(j, dv, target) {
  j.v += dv;
  if (target !== undefined) j.target = target;
  if (!jellyRunning) { jellyRunning = true; requestAnimationFrame(jellyLoop); }
}

// ------------------------------------------------------------
// 장미광장처럼 데이터가 있는 구역: 그 자리로 확대되면서 다음 화면으로
// (viewBox = SVG에서 "어디를 얼마나 크게 볼지" 정하는 창. 이걸 좁히면 확대)
// ------------------------------------------------------------
const FULL_VIEW = [0, 0, 390, 844];
function zoomInto(j, done) {
  const parentToMap = svg.getScreenCTM().inverse().multiply(j.el.parentElement.getScreenCTM());
  const center = new DOMPoint(j.cx, j.cy).matrixTransform(parentToMap);
  const to = [center.x - 70, center.y - 120, 140, 303]; // 구역 주변 (지도와 같은 세로 비율)
  const start = performance.now(), dur = 750;
  (function step(now) {
    const t = Math.min(1, (now - start) / dur);
    if (t > 0.55) document.body.classList.add('leaving'); // 확대가 반쯤 보인 뒤에 흐려지기 시작
    const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // 천천히-빠르게-천천히
    svg.setAttribute('viewBox', FULL_VIEW.map((v, i) => v + (to[i] - v) * e).join(' '));
    if (t < 1) requestAnimationFrame(step); else done();
  })(start);
}
// 뒤로가기로 돌아왔을 때 확대된 상태가 남아 있지 않게 되돌리기
window.addEventListener('pageshow', () => {
  svg.setAttribute('viewBox', FULL_VIEW.join(' '));
  document.body.classList.remove('leaving');
});

function openZone(zoneEl, j){
  if (zoneEl.hasAttribute('data-no-card')) {
    hideCard();
    return;
  }
  const id = zoneEl.dataset.zone, name = zoneEl.dataset.name, conf = findZone(id);
  const page = conf?.page || (conf?.source && 'interaction.html?zone=' + encodeURIComponent(id));
  if (page && j) {
    hideCard();
    zoomInto(j, () => { location.href = page; });
  } else {
    showCard(conf, name); // 준비 중인 구역: 짧은 소개 카드
  }
}

function attachLandmarkFeedback(button, art) {
  const spring = makeJelly(button, art);
  function respond(velocity, target) {
    spring.motion = button.dataset.motion || 'spring';
    poke(spring, velocity, target);
  }
  button.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    hideCard();
    respond(0, .24);
  });
  function release() {
    if (spring.target) respond(0, 0);
  }
  button.addEventListener('pointerleave', release);
  button.addEventListener('pointercancel', release);
  button.addEventListener('pointerup', release);
  button.addEventListener('click', () => {
    hideCard();
    spring.v = 0;
    respond(-5.6, 0);
  });
  button.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    if (!event.repeat) button.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  });
}

document.querySelectorAll('.zone').forEach(z => {
  // 연결표 기준으로 활성 표시를 맞춤 (SVG의 data-active를 일일이 고치지 않아도 됨)
  const conf = findZone(z.dataset.zone);
  z.dataset.active = String(Boolean(conf?.page || conf?.source));
  if (z.hasAttribute('data-feedback-only')) {
    attachLandmarkFeedback(z, document.getElementById(z.dataset.jellyTarget));
    return;
  }
  // data-jelly="false"인 구역(몽촌토성 산책로)은 출렁임 없이 누르면 바로 카드만
  if (z.dataset.jelly === 'false') {
    z.addEventListener('click', () => openZone(z, null));
    z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openZone(z, null); } });
    return;
  }
  const j = makeJelly(z);
  const tapKick = z.dataset.zone === 'wildlab' ? -3.4 : -2.5;
  z.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') poke(j, 1.2); });
  z.addEventListener('click', () => {
    poke(j, tapKick, 0);
    setTimeout(() => openZone(z, j), 180); // 출렁임을 살짝 보여준 뒤
  });
  z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(j, tapKick, 0); openZone(z, j); } });
});

</script>

document.querySelectorAll('.landmark [data-landmark]:not([data-static])').forEach(item => {
  const box = item.getBBox();
  const art = document.createElementNS(svg.namespaceURI, 'g');
  art.append(...item.children);
  const hit = document.createElementNS(svg.namespaceURI, 'rect');
  hit.setAttribute('x', box.x - 5);
  hit.setAttribute('y', box.y - 5);
  hit.setAttribute('width', box.width + 10);
  hit.setAttribute('height', box.height + 10);
  hit.setAttribute('fill', 'transparent');
  hit.setAttribute('class', 'landmark-hit');
  hit.setAttribute('rx', '7');
  item.setAttribute('role', 'button');
  item.setAttribute('tabindex', '0');
  item.append(hit, art);
  attachLandmarkFeedback(item, art);
});
