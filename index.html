<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>올림픽공원 말랑 지도</title>
<style>
 body{margin:0;background:#f6f1e7;color:#3f3a33;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;transition:opacity .35s}
 body.leaving{opacity:0}
 /* 첫 화면 한 줄 소개 (지도 그림 밖에 두어서 휴대폰에서도 글씨가 작아지지 않음) */
 .intro{width:min(960px,96vw);box-sizing:border-box;padding:20px 16px 4px}
 .intro h1{margin:0;font-size:24px;font-weight:800;color:#3d5a35}
 .intro p{margin:6px 0 0;font-size:15px;line-height:1.5;color:#6b665c}
 .intro b{color:#e5566f}
 .wrap{width:min(960px,96vw);position:relative}
 svg{width:100%;height:auto;display:block}
 .swipe-hint{display:none}
 /* 휴대폰: 지도를 화면보다 넓게 그리고 옆으로 밀어서 보기 → 구역 이름이 읽을 만한 크기로 */
 @media (max-width:680px){
   body{justify-content:flex-start}
   .wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
   svg{width:700px}
   .swipe-hint{display:block;margin:2px 0 12px;font-size:12px;color:#8a857c;text-align:center}
 }
 /* 구역 소개 카드: 준비 중인 구역을 누르면 아래에서 올라옴 */
 #zone-card{position:fixed;left:50%;bottom:20px;width:min(360px,calc(100vw - 32px));box-sizing:border-box;
   background:#fffaf2;border:1px solid #e6dcc8;border-radius:18px;padding:14px 44px 14px 16px;
   box-shadow:0 10px 30px rgba(60,50,30,.16);transform:translateX(-50%) translateY(calc(100% + 30px));
   transition:transform .35s cubic-bezier(.2,1.3,.4,1);z-index:10}
 #zone-card.show{transform:translateX(-50%) translateY(0)}
 #zone-card .head{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800}
 #zone-card .icon{font-size:22px}
 #zone-card .scenic{font-size:11px;font-weight:700;color:#3d5a35;background:#e3efd6;border-radius:999px;padding:2px 8px}
 #zone-card .desc{margin:6px 0 8px;font-size:14px;line-height:1.55;color:#4a463f}
 #zone-card .soon{font-size:12px;color:#9a958c}
 #zone-card .close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:none;font-size:20px;color:#9a958c;cursor:pointer}
</style></head><body>
<header class="intro">
  <h1>올림픽공원 말랑 지도</h1>
  <p>공원에서는 보호 때문에 만질 수 없는 식물을, 여기서는 마음껏 만져보세요. <b>구역을 눌러보세요.</b></p>
</header>
<div class="wrap" id="wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif">
  <!--
    올림픽공원 일러스트 지도 시안 v0.2 (실제 방향 반영, 2026-11-15)
    - 실제 지도를 따라 그린 것이 아니라, 구역의 대략적인 상대 위치만 참고한 일러스트입니다.
    - 누를 수 있는 구역은 <g class="zone" data-zone="..."> 입니다. 회색 <g class="landmark">는 방향 표시용 장식(누를 수 없음).
    - data-active="true" 인 구역만 실제 데이터(API)와 연결됩니다. 나머지는 "준비 중".
  -->
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2f4a2a" flood-opacity="0.18"/>
    </filter>
    <pattern id="grass" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#cfe6b8"/>
      <path d="M4 12 l2 -4 l2 4 M12 6 l2 -4 l2 4" stroke="#b7d79c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </pattern>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="560" fill="#f6f1e7"/>

  <!-- 공원 전체 윤곽 -->
  <path d="M70 120 C 90 60, 260 40, 420 50 C 590 60, 730 80, 745 170 C 760 270, 740 400, 690 460 C 630 520, 450 525, 300 515 C 160 505, 70 470, 55 380 C 42 300, 50 180, 70 120 Z"
        fill="url(#grass)" stroke="#9cc283" stroke-width="3"/>

  <!-- 산책로 (장식용, 세부 길 아님) -->
  <path d="M530 95 C 560 200, 520 300, 610 370" fill="none" stroke="#efe3c8" stroke-width="10" stroke-linecap="round"/>
  <path d="M180 470 C 300 440, 420 480, 520 455" fill="none" stroke="#efe3c8" stroke-width="10" stroke-linecap="round"/>

  <!-- ============ 장식 (누를 수 없음) ============ -->
  <!-- 방향을 잡아 줄 랜드마크(KSPO DOME·세계평화의 문·남1문 등)는 나중에 정하기로 하고 지금은 뺌 (2026-11-15) -->

  <!-- 몽촌해자 (3경): 토성을 서·남쪽으로 감싸는 물길 -->
  <g class="landmark" id="deco-moat" aria-hidden="true">
    <path d="M215 120 C 150 175, 140 320, 205 390 C 255 440, 370 445, 440 420" fill="none" stroke="#9fd3e6" stroke-width="13" stroke-linecap="round"/>
    <path d="M168 250 q 8 -6 16 0" fill="none" stroke="#e8f6fb" stroke-width="2.5" stroke-linecap="round"/>
    <text class="landmark-label" x="122" y="300" text-anchor="middle">몽촌해자</text>
  </g>

  <!-- ============ 구역들 (누를 수 있음) ============ -->

  <!-- 몽촌토성 산책로 (5경): 가운데~서쪽의 큰 언덕 -->
  <g class="zone" id="zone-tosung" data-zone="tosung" data-name="몽촌토성 산책로" data-active="false" tabindex="0" role="button" aria-label="몽촌토성 산책로">
    <path class="zone-hit" d="M195 235 C 192 155, 300 108, 400 116 C 492 124, 522 190, 506 262 C 490 338, 430 392, 330 394 C 236 396, 197 318, 195 235 Z"
          fill="#a9cf8c" stroke="#8dbb6e" stroke-width="3" filter="url(#soft)"/>
    <!-- 언덕 위 산책로 -->
    <path d="M222 300 C 250 220, 330 270, 365 205 S 450 175, 488 230" fill="none" stroke="#efe3c8" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 10"/>
    <text class="zone-label" x="330" y="378" text-anchor="middle">몽촌토성 산책로</text>
  </g>

  <!-- 나홀로나무 (6경): 토성 위 서쪽 -->
  <g class="zone" id="zone-lonetree" data-zone="lonetree" data-name="나홀로나무" data-active="false" tabindex="0" role="button" aria-label="나홀로나무">
    <circle class="zone-hit" cx="275" cy="225" r="34" fill="#fff" opacity="0.001"/>
    <g filter="url(#soft)">
      <rect x="271" y="225" width="8" height="22" rx="2" fill="#8a5a3b"/>
      <circle cx="275" cy="213" r="22" fill="#4f8f45"/>
      <circle cx="263" cy="207" r="10" fill="#5fa152"/>
    </g>
    <text class="zone-label small" x="275" y="266" text-anchor="middle">나홀로나무</text>
  </g>

  <!-- 야생화학습장: 토성 남동쪽 자락 -->
  <g class="zone" id="zone-wildlab" data-zone="wildlab" data-name="야생화학습장" data-active="false" tabindex="0" role="button" aria-label="야생화학습장">
    <circle class="zone-hit" cx="440" cy="318" r="44" fill="#fff" opacity="0.001"/>
    <ellipse cx="440" cy="320" rx="44" ry="22" fill="#e6dcf0"/>
    <g filter="url(#soft)">
      <g transform="translate(422 314)"><circle r="7" fill="#9b7fc9"/><circle r="2.5" fill="#fff3c4"/></g>
      <g transform="translate(444 306)"><circle r="6" fill="#ffffff"/><circle r="2.5" fill="#f2c230"/></g>
      <g transform="translate(462 322)"><circle r="7" fill="#b9a3da"/><circle r="2.5" fill="#fff3c4"/></g>
      <g transform="translate(436 328)"><circle r="5" fill="#ffffff"/><circle r="2" fill="#f2c230"/></g>
    </g>
    <text class="zone-label small" x="440" y="358" text-anchor="middle">야생화학습장</text>
  </g>

  <!-- 들꽃마루 (8경): 남동, 장미광장 옆 -->
  <g class="zone" id="zone-wildflower" data-zone="wildflower" data-name="들꽃마루" data-active="false" tabindex="0" role="button" aria-label="들꽃마루">
    <circle class="zone-hit" cx="690" cy="345" r="54" fill="#fff" opacity="0.001"/>
    <ellipse cx="690" cy="350" rx="48" ry="28" fill="#f4d9a8"/>
    <g filter="url(#soft)">
      <g transform="translate(670 342)"><circle r="8" fill="#f2a541"/><circle r="3" fill="#7a4b1d"/></g>
      <g transform="translate(696 332)"><circle r="9" fill="#f28ab2"/><circle r="3.5" fill="#fff3c4"/></g>
      <g transform="translate(716 350)"><circle r="7" fill="#f2a541"/><circle r="3" fill="#7a4b1d"/></g>
      <g transform="translate(688 360)"><circle r="7" fill="#e5566f"/><circle r="3" fill="#2b2b2b"/></g>
    </g>
    <text class="zone-label" x="690" y="398" text-anchor="middle">들꽃마루</text>
  </g>

  <!-- 장미광장 (9경): 남동쪽 — 실제 API 연결 구역 -->
  <g class="zone" id="zone-rose" data-zone="rose" data-name="장미광장" data-active="true" tabindex="0" role="button" aria-label="장미광장">
    <circle class="zone-hit" cx="580" cy="432" r="62" fill="#fde2e4" opacity="0.001"/>
    <circle class="zone-glow" cx="580" cy="425" r="50" fill="#fbd3d9"/>
    <g filter="url(#soft)">
      <!-- 방사형 화단 느낌의 장미 -->
      <g transform="translate(580 423)">
        <circle r="30" fill="#e5566f"/>
        <path d="M0 -22 C 14 -22, 20 -6, 10 2 C 2 8, -12 4, -12 -6 C -12 -16, -4 -20, 2 -16" fill="none" stroke="#b8324d" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M-20 4 C -18 18, 0 26, 16 18" fill="none" stroke="#b8324d" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="-30" cy="22" rx="11" ry="6" fill="#6fae5a" transform="rotate(-30 -30 22)"/>
        <ellipse cx="30" cy="22" rx="11" ry="6" fill="#6fae5a" transform="rotate(30 30 22)"/>
      </g>
    </g>
    <text class="zone-label" x="580" y="492" text-anchor="middle">장미광장</text>
    <g class="zone-badge">
      <rect x="608" y="374" width="46" height="20" rx="10" fill="#e5566f"/>
      <text x="631" y="388" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">만지기</text>
    </g>
  </g>

  <style>
    .zone { cursor: pointer; outline: none; }
    .zone-label { font-size: 14px; font-weight: 700; fill: #3f3a33; paint-order: stroke; stroke: #f6f1e7; stroke-width: 4px; }
    .zone-label.small { font-size: 12px; }
    /* 회색 랜드마크 장식: 누를 수 없음, 방향 잡기용 */
    .landmark { pointer-events: none; fill: #cfc9bf; stroke: #cfc9bf; }
    .landmark-label { font-size: 12px; font-weight: 600; fill: #9a958c; stroke: #f6f1e7; stroke-width: 3px; paint-order: stroke; }
    /* 마우스 올림·누름 때의 출렁임은 아래 script의 '젤리' 코드가 담당 */
    .zone[data-active="false"] { opacity: .78; transition: opacity .25s; }
    .zone[data-active="false"]:hover { opacity: 1; }
    .zone-glow { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1);} 50% { opacity: .9; transform: scale(1.08);} }
  </style>
</svg>

</div>
<p class="swipe-hint">← 옆으로 밀어서 지도 둘러보기 →</p>
<aside id="zone-card" aria-live="polite">
  <button class="close" aria-label="닫기">×</button>
  <div class="head"><span class="icon"></span><span class="name"></span><span class="scenic"></span></div>
  <p class="desc"></p>
  <div class="soon">🌱 곧 만져볼 수 있어요</div>
</aside>
<!-- 구역 연결표는 js/zones.js 한 곳에서 관리 (인터랙션 페이지와 공유) -->
<script src="js/zones.js"></script>
<script>
const svg = document.querySelector('svg');
// 구역 소개 카드: 내용은 js/zones.js의 icon · name · scenic · intro 에서 가져옴
const card = document.getElementById('zone-card');
function showCard(conf, fallbackName) {
  card.querySelector('.icon').textContent = (conf && conf.icon) || '';
  card.querySelector('.name').textContent = (conf && conf.name) || fallbackName;
  const scenic = card.querySelector('.scenic');
  scenic.textContent = (conf && conf.scenic) || '';
  scenic.style.display = scenic.textContent ? '' : 'none';
  card.querySelector('.desc').textContent = (conf && conf.intro) || '';
  card.classList.add('show');
}
function hideCard() { card.classList.remove('show'); }
card.querySelector('.close').addEventListener('click', hideCard);
// 카드 밖(구역이 아닌 곳)을 누르면 닫힘
document.addEventListener('pointerdown', e => {
  if (!card.contains(e.target) && !e.target.closest('.zone')) hideCard();
});

// ------------------------------------------------------------
// 젤리 구역: 각 구역에 작은 용수철을 달아 둔다.
//   마우스 올림 → 살짝 출렁 / 누름 → 납작하게 눌림 / 놓음 → 통 튀며 출렁
//   a = 찌그러진 정도 (+ 옆으로 넓적, - 위로 길쭉), 0이면 원래 모양
// ------------------------------------------------------------
const jellies = [];
function makeJelly(el) {
  const box = el.getBBox();
  const j = { el, cx: box.x + box.width / 2, cy: box.y + box.height, a: 0, v: 0, target: 0 }; // 바닥 가운데를 기준으로 찌그러짐
  jellies.push(j);
  return j;
}
let jellyRunning = false;
function jellyLoop() {
  let moving = false;
  jellies.forEach(j => {
    j.v += (300 * (j.target - j.a) - 9 * j.v) / 60;  // 용수철 힘 - 흔들림 줄이는 힘
    j.a += j.v / 60;
    if (Math.abs(j.v) > 0.0005 || Math.abs(j.target - j.a) > 0.0005) moving = true;
    const sx = 1 + j.a, sy = 1 - j.a;
    j.el.setAttribute('transform', `translate(${j.cx} ${j.cy}) scale(${sx} ${sy}) translate(${-j.cx} ${-j.cy})`);
  });
  jellyRunning = moving;
  if (moving) requestAnimationFrame(jellyLoop);
}
function poke(j, dv, target) {
  j.v += dv;
  if (target !== undefined) j.target = target;
  if (!jellyRunning) { jellyRunning = true; requestAnimationFrame(jellyLoop); }
}

// ------------------------------------------------------------
// 장미광장처럼 데이터가 있는 구역: 그 자리로 확대되면서 다음 화면으로
// (viewBox = SVG에서 "어디를 얼마나 크게 볼지" 정하는 창. 이걸 좁히면 확대)
// ------------------------------------------------------------
const FULL_VIEW = [0, 0, 800, 560];
function zoomInto(j, done) {
  const to = [j.cx - 90, j.cy - 100, 180, 126]; // 구역 주변 180×126 영역
  const start = performance.now(), dur = 750;
  (function step(now) {
    const t = Math.min(1, (now - start) / dur);
    if (t > 0.55) document.body.classList.add('leaving'); // 확대가 반쯤 보인 뒤에 흐려지기 시작
    const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // 천천히-빠르게-천천히
    svg.setAttribute('viewBox', FULL_VIEW.map((v, i) => v + (to[i] - v) * e).join(' '));
    if (t < 1) requestAnimationFrame(step); else done();
  })(start);
}
// 뒤로가기로 돌아왔을 때 확대된 상태가 남아 있지 않게 되돌리기
window.addEventListener('pageshow', () => {
  svg.setAttribute('viewBox', FULL_VIEW.join(' '));
  document.body.classList.remove('leaving');
});

function openZone(zoneEl, j){
  const id = zoneEl.dataset.zone, name = zoneEl.dataset.name, conf = findZone(id);
  if (conf && conf.source) {
    hideCard();
    zoomInto(j, () => { location.href = 'interaction.html?zone=' + encodeURIComponent(id); });
  } else {
    showCard(conf, name); // 준비 중인 구역: 짧은 소개 카드
  }
}

document.querySelectorAll('.zone').forEach(z => {
  // 연결표 기준으로 활성 표시를 맞춤 (SVG의 data-active를 일일이 고치지 않아도 됨)
  const conf = findZone(z.dataset.zone);
  z.dataset.active = String(!!(conf && conf.source));
  const j = makeJelly(z);
  z.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') poke(j, 1.2); });
  z.addEventListener('pointerdown', () => poke(j, 0, 0.12));             // 꾹 → 납작
  z.addEventListener('pointerleave', () => { if (j.target) poke(j, 0, 0); });
  z.addEventListener('pointerup', () => poke(j, -2.5, 0));                // 놓음 → 통!
  z.addEventListener('click', () => setTimeout(() => openZone(z, j), 180)); // 출렁임을 살짝 보여준 뒤
  z.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(j, -2.5, 0); openZone(z, j); } });
});

// 휴대폰에서 지도가 옆으로 길면, 처음엔 장미광장이 보이도록 가운데 맞춤
const wrap = document.getElementById('wrap');
if (wrap.scrollWidth > wrap.clientWidth) {
  const rose = jellies.find(j => j.el.dataset.zone === 'rose');
  if (rose) wrap.scrollLeft = rose.cx / 800 * wrap.scrollWidth - wrap.clientWidth / 2;
}
</script>
</body></html>
