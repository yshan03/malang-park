<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말랑 장미 만지기</title>
<style>
  :root {
    --bg: #f6f1e7; --ink: #3f3a33; --muted: #8a857c; --card: #fffaf2; --line: #e6dcc8; --accent: #e5566f;
    /* 상세 모드 꽃 자리 (js/squishy.js의 DETAIL_SPLIT·HEADER_PX·BUTTON_ZONE_PX와 같은 값)
       시트 닫힘: 머리글(64px) 아래 ~ TMI 버튼 자리(110px) 위의 가운데
       시트 열림: 위 58%의 가운데 */
    --split: 58vh;
    --flower-y: calc((64px + 100vh - 110px) / 2);
  }
  body.sheet-open { --flower-y: calc((64px + var(--split)) / 2); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  }
  button { font: inherit; color: inherit; }

  /* ----- 위쪽 머리글 ----- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .back {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; min-width: 40px;
    padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
    color: var(--ink); text-decoration: none; font-size: 15px; cursor: pointer;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 800; color: #3d5a35; }
  .hint { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  body.detail .titles { display: none; }               /* 상세 모드에선 구역 제목 대신 꽃 이름 */

  /* ----- 상세 모드: 위 가운데 꽃 이름 ----- */
  #flower-name {
    position: fixed; z-index: 5; top: 16px; left: 64px; right: 64px; margin: 0; text-align: center;
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 32px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateY(-8px); transition: opacity .3s, transform .3s; pointer-events: none;
  }
  body.detail #flower-name { opacity: 1; transform: none; }

  /* ----- 상세 모드: 만지는 법 안내 (처음 만지면 사라짐) ----- */
  #touch-hint {
    position: fixed; z-index: 3; left: 0; right: 0; bottom: 96px; text-align: center;
    font-size: 13px; color: var(--muted); pointer-events: none; opacity: 0; transition: opacity .4s;
  }
  body.detail:not(.sheet-open):not(.touched) #touch-hint { opacity: 1; }

  /* ----- 상세 모드: TMI 🤓 버튼 (아래 가운데, 시트가 열리면 시트 위 가장자리로 같이 올라감) ----- */
  #tmi {
    position: fixed; z-index: 7; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: 64px; height: 64px; padding: 0; border: 0; cursor: pointer;
    display: grid; place-items: center; background: none; /* 테두리·배경 없이 이모지만 */
    opacity: 0; pointer-events: none;
    transition: bottom .45s cubic-bezier(.2, .9, .3, 1), opacity .3s, background .2s;
  }
  #tmi .emoji { display: inline-block; font-size: 46px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(40, 30, 20, .22)); }
  body.detail #tmi { opacity: 1; pointer-events: auto; }
  body.detail:not(.sheet-open) #tmi .emoji { animation: nerd-hop 3.2s ease-in-out infinite; }
  body.sheet-open #tmi { bottom: calc(100vh - var(--split) - 32px); }
  @keyframes nerd-hop { /* 가끔 통통 튀며 눌러 보라고 손짓 */
    0%, 70%, 100% { transform: translateY(0) rotate(0); }
    76% { transform: translateY(-7px) rotate(-10deg); }
    82% { transform: translateY(0) rotate(0); }
    88% { transform: translateY(-4px) rotate(8deg); }
    94% { transform: translateY(0) rotate(0); }
  }

  /* ----- 3D 무대 ----- */
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  .blob-label {
    position: absolute; top: 0; left: 0; pointer-events: none;
    font-size: 14px; font-weight: 700; white-space: nowrap;
    padding: 2px 10px; border-radius: 999px; background: rgba(255, 250, 242, .85);
    transition: opacity .25s;
  }
  .blob-label.hidden { opacity: 0; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); }

  /* ----- 상세 모드: 이전 / 다음 버튼 (꽃 높이에 맞춰 양옆) ----- */
  .nav {
    position: fixed; z-index: 6; top: var(--flower-y); transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); font-size: 26px; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 14px rgba(60, 50, 30, .12);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .nav.prev { left: 16px; }
  .nav.next { right: 16px; }
  body.detail .nav { opacity: 1; pointer-events: auto; }

  /* ----- 상세 모드: 아래 정보 영역 ----- */
  #info {
    position: fixed; z-index: 4; left: 0; right: 0; top: var(--split); bottom: 0; overflow-y: auto;
    background: var(--card); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0;
    padding: 22px 20px 32px; box-shadow: 0 -8px 30px rgba(60, 50, 30, .08);
    transform: translateY(100%); transition: transform .45s cubic-bezier(.2, .9, .3, 1);
  }
  body.detail.sheet-open #info { transform: translateY(0); }   /* TMI 🤓 를 눌러야 올라옴 */
  #info { padding-top: 40px; }                                /* 위 가장자리에 걸친 TMI 버튼 자리 */
  #info .inner { max-width: 640px; margin: 0 auto; }
  #info h2 { margin: 0; font-size: 24px; }
  #info .photo { width: 100%; max-width: 420px; aspect-ratio: 3/2; object-fit: cover; display: block; border-radius: 14px; margin-top: 16px; background: var(--line); }
  #info .swatch { display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: 1px; margin-right: 8px; }
  #info .en { margin: 2px 0 12px; color: var(--muted); font-size: 14px; }
  #info .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #info .tags span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #f1e8d8; }
  #info p.desc { margin: 0; font-size: 15px; line-height: 1.7; }
  #info a.more { display: inline-block; margin-top: 12px; color: var(--accent); font-size: 13px; }
  #info .count { margin-top: 16px; font-size: 12px; color: var(--muted); }
  #info .credit { margin-top: 6px; font-size: 11px; color: #b0aaa0; }
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="index.html" aria-label="지도로 돌아가기">←</a>
  <div class="titles">
    <h1 id="title">불러오는 중…</h1>
    <p class="hint">꽃을 눌러 자세히 보고, 끌어서 굴려보세요</p>
  </div>
</header>
<h2 id="flower-name" aria-live="polite"></h2>

<div id="stage"></div>

<p id="touch-hint">꾹 눌러보고, 끌어서 돌려보세요</p>
<button id="tmi" aria-expanded="false" aria-controls="info" aria-label="설명 보기"><span class="emoji">🤓</span></button>

<button class="nav prev" id="prev" aria-label="이전 꽃">‹</button>
<button class="nav next" id="next" aria-label="다음 꽃">›</button>

<section id="info" aria-live="polite"><div class="inner" id="info-body"></div></section>

<!-- 3D 그리기 도구 (three.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 우리 코드: 데이터 → 변환기 → 구역표 → 데이터 창고 → 인터랙션 -->
<script src="data/rose-sample.js"></script>
<!-- 미리 받아 둔 API 데이터 (tools/fetch-roses.py 로 생성). 인증키는 들어 있지 않다. -->
<script src="data/rose-api.js"></script>
<script src="js/adapters/roseAdapter.js"></script>
<script src="js/zones.js"></script>
<script src="js/dataStore.js"></script>
<script src="js/squishy.js"></script>
<script>
(async function () {
  // ------------------------------------------------------------
  // 이 페이지의 상태는 주소(URL)가 정한다:
  //   interaction.html?zone=rose               → 목록 모드
  //   interaction.html?zone=rose&item=에버골드   → 상세 모드
  // 그래서 새로고침·뒤로가기·주소 공유를 해도 같은 화면이 나온다.
  // ------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const zoneId = params.get('zone') || 'rose';
  const zone = findZone(zoneId);
  const zoneName = zone ? zone.name : '알 수 없는 구역';
  document.getElementById('title').textContent = zoneName;

  const { items, from } = await getItems(zoneId);
  // 출처: 화면 위 표시 대신 TMI 시트 맨 아래에 작게 (사진 출처 표시용)
  const CREDIT = from === 'api' ? '정보·사진: 한국체육산업개발(주) 올림픽공원 장미정보' : '샘플 데이터';

  if (!items.length) {
    document.body.insertAdjacentHTML('beforeend', '<div class="empty">이 구역은 데이터 준비 중이에요</div>');
    return;
  }

  const scene = createSquishyScene(document.getElementById('stage'), items, {
    onOpen: index => openDetail(index, 0, 'push') // 목록에서 꽃을 톡 누르면
  });

  let current = -1; // 상세 모드에서 보고 있는 꽃 번호 (-1 = 목록)

  function urlFor(index) {
    const p = new URLSearchParams({ zone: zoneId });
    if (index >= 0) p.set('item', items[index].name);
    return 'interaction.html?' + p.toString();
  }

  // ----- 상세 모드로 -----
  // how: 'push' = 새 기록 남김(목록→상세), 'replace' = 기록 덮어씀(이전/다음), 'none' = 주소 그대로
  function openDetail(index, dir, how) {
    current = index;
    setSheet(false);                      // 새 꽃은 이름만 보이게 (설명은 닫고 시작)
    renderInfo(items[index], index);
    document.getElementById('flower-name').textContent = items[index].name;
    document.body.classList.add('detail');
    document.title = items[index].name + ' · ' + zoneName;
    scene.showDetail(index, dir);
    if (how === 'push') history.pushState({ fromList: true }, '', urlFor(index));
    if (how === 'replace') history.replaceState(history.state, '', urlFor(index));
  }

  // ----- 목록 모드로 -----
  function openList(how) {
    current = -1;
    setSheet(false);
    document.body.classList.remove('detail');
    document.title = zoneName + ' · 말랑 지도';
    scene.showList();
    if (how === 'replace') history.replaceState(null, '', urlFor(-1));
  }

  function step(dir) { // dir: -1 이전, +1 다음 (끝에 가면 처음으로 돌아감)
    const n = items.length;
    openDetail((current + dir + n) % n, dir, 'replace');
  }

  // ----- 정보 영역 채우기 (공통 형태의 필드만 사용) -----
  function renderInfo(item, index) {
    const box = document.getElementById('info-body');
    box.innerHTML = '';
    const h2 = document.createElement('h2');
    if (item.colorHex) { // 꽃색 정보가 있을 때만 색 동그라미
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = item.colorHex2 ? `linear-gradient(${item.colorHex}, ${item.colorHex2})` : item.colorHex;
      h2.appendChild(sw);
    }
    h2.append(item.name);
    box.appendChild(h2);
    if (item.nameEn) { const en = document.createElement('p'); en.className = 'en'; en.textContent = item.nameEn; box.appendChild(en); }
    if (item.tags && item.tags.length) { // 정보가 없으면 칸 자체를 만들지 않음
      const tags = document.createElement('div'); tags.className = 'tags';
      item.tags.forEach(t => { const s = document.createElement('span'); s.textContent = t; tags.appendChild(s); });
      box.appendChild(tags);
    } else {
      h2.style.marginBottom = '12px';
    }
    const p = document.createElement('p'); p.className = 'desc'; p.textContent = item.description; box.appendChild(p);
    // 사진은 참고용이라 설명 아래에 (주인공은 위의 말랑한 도형)
    const urls = item.imageUrls || (item.imageUrl ? [item.imageUrl] : []);
    if (urls.length) {
      const img = new Image();
      img.className = 'photo'; img.alt = item.name + ' 사진';
      let tryIndex = 0;
      img.src = urls[0];
      img.onerror = () => { // 깨지면 다음 후보로, 후보가 다 떨어지면 사진을 뺌
        tryIndex++;
        if (tryIndex < urls.length) img.src = urls[tryIndex];
        else img.remove();
      };
      box.appendChild(img);
    }
    if (item.detailUrl) {
      const a = document.createElement('a'); a.className = 'more'; a.href = item.detailUrl; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '자세히 보기 →'; box.appendChild(a);
    }
    const count = document.createElement('p'); count.className = 'count';
    count.textContent = `${index + 1} / ${items.length}`;
    box.appendChild(count);
    const credit = document.createElement('p'); credit.className = 'credit';
    credit.textContent = CREDIT;
    box.appendChild(credit);
    document.getElementById('info').scrollTop = 0;
  }

  // ----- TMI 🤓 시트: 버튼을 눌러야 열리고, 다시 눌러야 닫힘 -----
  const tmi = document.getElementById('tmi');
  function setSheet(open) {
    document.body.classList.toggle('sheet-open', open);
    tmi.setAttribute('aria-expanded', String(open));
    if (scene) scene.setSheet(open);
  }
  tmi.addEventListener('click', () => setSheet(!document.body.classList.contains('sheet-open')));

  // 꽃을 처음 만지면 "꾹 눌러보고…" 안내를 숨김
  document.getElementById('stage').addEventListener('pointerdown', () => {
    if (current >= 0) document.body.classList.add('touched');
  });

  // ----- 버튼·키보드 -----
  document.getElementById('back').addEventListener('click', e => {
    if (current < 0) return; // 목록 모드: 원래대로 지도로 이동
    e.preventDefault();
    // 목록에서 들어왔으면 브라우저 '뒤로'와 똑같이, 주소로 바로 들어왔으면 목록 주소로 바꿈
    if (history.state && history.state.fromList) history.back();
    else openList('replace');
  });
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);
  document.addEventListener('keydown', e => {
    if (current < 0) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'Escape') document.getElementById('back').click();
  });

  // 브라우저 뒤로가기/앞으로가기 → 주소를 다시 읽어서 화면 맞추기
  function syncFromUrl() {
    const name = new URLSearchParams(location.search).get('item');
    const index = items.findIndex(it => it.name === name);
    if (index >= 0) { if (index !== current) openDetail(index, 0, 'none'); }
    else if (current >= 0) openList('none');
  }
  window.addEventListener('popstate', syncFromUrl);
  syncFromUrl(); // 처음 열 때 주소에 item이 있으면 바로 상세 모드
})();
</script>
</body>
</html>
