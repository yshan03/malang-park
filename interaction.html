<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>말랑 장미 만지기</title>
<!-- 꽃 이름용 손글씨 글꼴 (Gaegu 굵게, 무료 구글 웹폰트) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7; --ink: #3f3a33; --muted: #8a857c; --card: #fffaf2; --line: #e6dcc8; --accent: #e5566f;
    /* 상세 모드 꽃 자리 (js/squishy.js의 DETAIL_SPLIT·HEADER_PX·BUTTON_ZONE_PX와 같은 값)
       시트 닫힘: 머리글(64px) 아래 ~ TMI 버튼 자리(110px) 위의 가운데
       시트 열림: 위 58%의 가운데 */
    --split: 58vh;
    --flower-y: calc((64px + 100vh - 110px) / 2);
  }
  body.sheet-open { --flower-y: calc((64px + var(--split)) / 2); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  }
  button { font: inherit; color: inherit; }

  /* ----- 위쪽 머리글 ----- */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .back {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; min-width: 40px;
    padding: 0 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
    color: var(--ink); text-decoration: none; font-size: 15px; cursor: pointer;
  }
  /* 구역 이름(h1): 유리병 태그에 손글씨로 이미 써 있어서 화면에서는 숨김 (2026-11-18).
     화면 읽기 프로그램(시각장애인용)에는 그대로 읽히도록 "보이지만 않게" 처리 */
  h1 { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .hint { margin: 0; font-size: 13px; color: var(--muted); transition: opacity .4s; }   /* 혼자 남아서 12 → 13px */
  body.list-touched .hint { opacity: 0; }                /* 밭을 한 번 만지면 스르르 사라짐 */
  .titles { flex: 1; text-align: center; }          /* 안내 문구: ← 버튼과 🔍 버튼 사이 가운데 */
  body.detail .titles { display: none; }               /* 상세 모드에선 구역 제목 대신 꽃 이름 */

  /* ----- 목록 모드: 오른쪽 위 🔍 버튼 + 꽃 찾기 창 ----- */
  #find-btn {
    margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); font-size: 18px; cursor: pointer; display: grid; place-items: center;
  }
  body.detail #find-btn, body.is-empty #find-btn { display: none; }
  #finder {
    position: fixed; z-index: 8; top: 60px; right: 12px; width: min(320px, calc(100vw - 24px));
    max-height: min(70vh, 520px); display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 14px 40px rgba(60, 50, 30, .18); overflow: hidden;
    opacity: 0; transform: translateY(-8px) scale(.98); transform-origin: top right;
    pointer-events: none; transition: opacity .2s, transform .2s;
  }
  body.finder-open #finder { opacity: 1; transform: none; pointer-events: auto; }
  .finder-top { padding: 12px; border-bottom: 1px solid var(--line); }
  #find-input {
    width: 100%; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; font: inherit; font-size: 16px; color: var(--ink); outline: none; /* 16px: 아이폰 자동 확대 방지 */
  }
  #find-input:focus { border-color: var(--accent); }
  #find-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
  #find-list button {
    width: 100%; text-align: left; padding: 10px 12px; border: 0; border-radius: 10px;
    background: none; font-size: 15px; cursor: pointer;
  }
  #find-list button:hover, #find-list button:focus-visible { background: #f1e8d8; outline: none; }
  #find-list mark { background: none; color: var(--accent); font-weight: 800; }
  #find-none { display: none; margin: 0; padding: 18px; text-align: center; font-size: 14px; color: var(--muted); }

  /* ----- 상세 모드: 위 가운데 꽃 이름 ----- */
  /* 꽃 이름: 손글씨 — 진한 꽃 색 글자 하나, 테두리·그림자 없이 가볍게 (색은 꽃마다 JS가 --deep에 넣음) */
  #flower-name {
    --deep: #8A3550;
    position: fixed; z-index: 5; top: 8px; left: 60px; right: 60px; margin: 0; padding: 4px 6px 8px; text-align: center;
    font-family: 'Gaegu', 'Apple SD Gothic Neo', sans-serif; font-weight: 700; font-size: 34px; line-height: 38px;
    color: var(--deep);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateY(-8px); transition: opacity .3s, transform .3s; pointer-events: none;
  }
  body.detail #flower-name { opacity: 1; transform: none; }
  #flower-name.pop { animation: name-pop .5s cubic-bezier(.3, 1.6, .5, 1); } /* 꽃이 바뀔 때 통! */
  #flower-name span { display: inline-block; white-space: pre; }   /* 글자마다 따로 기울이려고 (wobbleName) */
  @keyframes name-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* ----- 상세 모드: 만지는 법 안내 (처음 만지면 사라짐) ----- */
  #touch-hint { /* 꽃 이름 바로 아래 (줄기가 생겨 꽃송이가 위쪽에 있으므로, 아래 🤓 버튼과 떨어뜨림) */
    position: fixed; z-index: 3; left: 0; right: 0; top: 58px; text-align: center;
    font-size: 13px; color: var(--hint-c, var(--muted)); font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .4s;
  }
  body.detail:not(.sheet-open):not(.touched) #touch-hint { opacity: 1; }

  /* ----- 상세 모드: TMI 🤓 버튼 (아래 가운데, 시트가 열리면 시트 위 가장자리로 같이 올라감) ----- */
  #tmi {
    position: fixed; z-index: 7; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: 64px; height: 64px; padding: 0; border: 0; cursor: pointer;
    display: grid; place-items: center; background: none; /* 테두리·배경 없이 이모지만 */
    opacity: 0; pointer-events: none;
    transition: bottom .45s cubic-bezier(.2, .9, .3, 1), opacity .3s, background .2s;
  }
  #tmi .emoji { display: inline-block; font-size: 46px; line-height: 1; filter: drop-shadow(0 4px 6px rgba(40, 30, 20, .22)); }
  body.detail #tmi { opacity: 1; pointer-events: auto; }
  body.detail:not(.sheet-open) #tmi .emoji { animation: nerd-hop 3.2s ease-in-out infinite; }
  body.sheet-open #tmi { bottom: calc(100vh - var(--split) - 32px); }
  @keyframes nerd-hop { /* 가끔 통통 튀며 눌러 보라고 손짓 */
    0%, 70%, 100% { transform: translateY(0) rotate(0); }
    76% { transform: translateY(-7px) rotate(-10deg); }
    82% { transform: translateY(0) rotate(0); }
    88% { transform: translateY(-4px) rotate(8deg); }
    94% { transform: translateY(0) rotate(0); }
  }

  /* ----- 3D 무대 ----- */
  #stage { position: fixed; inset: 0; }
  /* 길게 눌러도 글자 선택·확대·메뉴가 뜨지 않게 (블롭을 꾹 누르는 화면이라서). TMI 설명 글은 선택 가능 */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #info, #find-input { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  #stage canvas { display: block; }
  .blob-label {
    position: absolute; top: 0; left: 0; pointer-events: none;
    font-size: 14px; font-weight: 700; white-space: nowrap;
    padding: 2px 10px; border-radius: 999px; background: rgba(255, 250, 242, .85);
    transition: opacity .25s;
  }
  .blob-label.hidden { opacity: 0; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; padding: 0 24px; text-align: center; color: var(--muted); font-size: 16px; }
  body.is-empty .titles { display: none; }

  /* ----- 상세 모드: 이전 / 다음 버튼 (꽃 높이에 맞춰 양옆) ----- */
  .nav {
    position: fixed; z-index: 6; top: var(--flower-y); transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--card); font-size: 26px; line-height: 1; cursor: pointer;
    box-shadow: 0 4px 14px rgba(60, 50, 30, .12);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .nav.prev { left: 16px; }
  .nav.next { right: 16px; }
  body.detail .nav { opacity: 1; pointer-events: auto; }

  /* ----- 상세 모드: 아래 정보 영역 ----- */
  #info {
    position: fixed; z-index: 4; left: 0; right: 0; top: var(--split); bottom: 0; overflow-y: auto;
    background: var(--card); border-top: 1px solid var(--line); border-radius: 24px 24px 0 0;
    padding: 22px 20px 32px; box-shadow: 0 -8px 30px rgba(60, 50, 30, .08);
    transform: translateY(100%); transition: transform .45s cubic-bezier(.2, .9, .3, 1);
  }
  body.detail.sheet-open #info { transform: translateY(0); }   /* TMI 🤓 를 눌러야 올라옴 */
  #info { padding-top: 40px; }                                /* 위 가장자리에 걸친 TMI 버튼 자리 */
  #info .inner { max-width: 640px; margin: 0 auto; }
  /* TMI 꽃 이름·설명도 손글씨(Gaegu 굵게, 2026-11-19). 손글씨는 같은 크기면 작아 보여서 키움 (이름 24→30px, 설명 15→18px) */
  /* TMI의 꽃 이름: 화면 위에 이미 손글씨 이름이 떠 있어서 여기선 숨김 (화면 읽기 프로그램에는 읽히게) — 2026-11-19 */
  #info h2 { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #info .photo { width: 100%; max-width: 420px; aspect-ratio: 3/2; object-fit: cover; display: block; border-radius: 14px; margin-top: 16px; background: var(--line); }
  #info .swatch { display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: 1px; margin-right: 8px; }
  #info .en { margin: 2px 0 12px; color: var(--muted); font-size: 14px; }
  #info .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #info .tags span { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #f1e8d8; }
  /* 줄 있는 공책 (2026-11-23): "이 장미는"과 설명 글 아래에 연한 가로줄. 줄 간격 = 글 줄 높이(33.6px = 21px × 1.6)라서
     손글씨가 줄 위에 쓰인 것처럼 보임. 줄은 각 줄 칸의 맨 아래에 1px로 그림(repeating-linear-gradient) */
  #info { --rule: 33.6px; --rule-c: #e6d9bf; }
  #info p.about, #info p.desc {
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--rule) - 1px), var(--rule-c) calc(var(--rule) - 1px), var(--rule-c) var(--rule));
    line-height: var(--rule);
  }
  #info p.about { margin: 0; font-family: 'Gaegu', 'Apple SD Gothic Neo', sans-serif; font-weight: 700; font-size: 26px; color: var(--hint-c, var(--ink)); }   /* '이 장미는' — 그 꽃의 진한 색 (공책 첫 줄) */
  #info p.desc { margin: 0; font-family: 'Gaegu', 'Apple SD Gothic Neo', sans-serif; font-weight: 700; font-size: 21px; color: #6B9A2E; }   /* 설명 21px · 연두색 (밝은 연두는 흰 카드에서 안 읽혀서 조금 진한 연두) */
  #info a.more { display: inline-block; margin-top: 12px; color: var(--accent); font-size: 13px; }
  #info .count { margin-top: 16px; font-size: 12px; color: var(--muted); }
  #info .credit { margin-top: 6px; font-size: 11px; color: #b0aaa0; }
</style>
</head>
<body>
<header>
  <a class="back" id="back" href="index.html" aria-label="지도로 돌아가기">←</a>
  <div class="titles">
    <h1 id="title">불러오는 중…</h1>
    <p class="hint">꽃을 끌어서 굴려보고, 눌러 자세히 보세요</p>
  </div>
  <button id="find-btn" aria-label="꽃 이름으로 찾기" aria-expanded="false" aria-controls="finder">🔍</button>
</header>

<!-- 꽃 찾기 창: 위 검색창 + 아래 이름 목록 (칠수록 목록이 줄어듦) -->
<div id="finder" role="dialog" aria-label="꽃 찾기">
  <div class="finder-top">
    <input id="find-input" type="search" placeholder="꽃 이름으로 찾기" autocomplete="off" enterkeyhint="go">
  </div>
  <ul id="find-list"></ul>
  <p id="find-none">그런 이름의 장미는 아직 없어요 🥲</p>
</div>
<h2 id="flower-name" aria-live="polite"></h2>

<div id="stage"></div>

<p id="touch-hint">꾹 눌러보고, 끌어서 돌려보세요</p>
<button id="tmi" aria-expanded="false" aria-controls="info" aria-label="설명 보기"><span class="emoji">🤓</span></button>

<button class="nav prev" id="prev" aria-label="이전 꽃">‹</button>
<button class="nav next" id="next" aria-label="다음 꽃">›</button>

<section id="info" aria-live="polite"><div class="inner" id="info-body"></div></section>

<!-- 3D 그리기 도구 (three.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 우리 코드: 데이터 → 변환기 → 구역표 → 데이터 창고 → 인터랙션 -->
<script src="data/rose-sample.js"></script>
<!-- 미리 받아 둔 API 데이터 (tools/fetch-roses.py 로 생성). 인증키는 들어 있지 않다. -->
<script src="data/rose-api.js"></script>
<script src="js/adapters/roseAdapter.js"></script>
<script src="js/blobShapes.js"></script>        <!-- 꽃 블롭 만드는 틀 (장미를 모름) -->
<!-- 장미 사진에서 미리 뽑아 둔 블롭 색 (tools/extract-rose-colors.py 로 생성). 사진은 들어 있지 않다. -->
<script src="data/rose-colors.js"></script>
<!-- 장미별 블롭 모양 종류 (홑꽃·하이센터·컵·활짝 핀 겹꽃). 사진을 보고 나눈 결과 -->
<script src="data/rose-shapes.js"></script>
<!-- 장미별 새 분류 (모양·꽃잎 겹 수·바깥 꽃잎 끝). 평평·컵·하이센터는 이걸로 블롭을 만들고, 나머지는 위 모양 종류를 씀 -->
<script src="data/rose-forms.js"></script>
<!-- 장미 카드: 장미마다 블롭 모양 값 (있으면 이게 먼저). 장미 하나만 고칠 때는 여기 그 장미 줄만 -->
<script src="data/rose-cards.js"></script>
<script src="js/designs/roseBlobs.js"></script> <!-- 장미별 블롭 디자인 설정 -->
<script src="js/zones.js"></script>
<script src="js/dataStore.js"></script>
<script src="js/squishy.js"></script>
<script>
(async function () {
  // ------------------------------------------------------------
  // 이 페이지의 상태는 주소(URL)가 정한다:
  //   interaction.html?zone=rose               → 목록 모드
  //   interaction.html?zone=rose&item=에버골드   → 상세 모드
  // 그래서 새로고침·뒤로가기·주소 공유를 해도 같은 화면이 나온다.
  // ------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const zoneId = params.get('zone') || 'rose';
  const zone = findZone(zoneId);
  const zoneName = zone ? zone.name : '알 수 없는 구역';
  document.getElementById('title').textContent = zoneName;

  const { items, from } = await getItems(zoneId);
  // 출처: 화면 위 표시 대신 TMI 시트 맨 아래에 작게 (사진 출처 표시용)
  const CREDIT = from === 'api' ? '정보·사진: 한국체육산업개발(주) 올림픽공원 장미정보' : '샘플 데이터';

  if (!items.length) {
    // 데이터 없는 구역: 가운데 문구 하나만 (제목·안내는 숨기고, 돌아갈 ← 버튼만 남김)
    document.body.classList.add('is-empty');
    document.body.insertAdjacentHTML('beforeend', '<div class="empty">아직 말랑이가 덜 말랑해요 🫧 조금만 기다려 주세요</div>');
    return;
  }

  const scene = createSquishyScene(document.getElementById('stage'), items, {
    onOpen: index => openDetail(index, 0, 'push') // 목록에서 꽃을 톡 누르면
  });

  let current = -1; // 상세 모드에서 보고 있는 꽃 번호 (-1 = 목록)

  function urlFor(index) {
    const p = new URLSearchParams({ zone: zoneId });
    if (index >= 0) p.set('item', items[index].name);
    return 'interaction.html?' + p.toString();
  }

  // ----- 상세 모드로 -----
  // how: 'push' = 새 기록 남김(목록→상세), 'replace' = 기록 덮어씀(이전/다음), 'none' = 주소 그대로
  function openDetail(index, dir, how) {
    current = index;
    setSheet(false);                      // 새 꽃은 이름만 보이게 (설명은 닫고 시작)
    renderInfo(items[index], index);
    // 꽃 이름: 진한 꽃 색 손글씨 + 통 튀는 등장 / 안내 문구도 같은 색 (꽃에 대한 안내임을 보여줌)
    const nameEl = document.getElementById('flower-name');
    wobbleName(nameEl, items[index].name);
    const deep = nameTone(items[index]);
    nameEl.style.setProperty('--deep', deep);
    document.body.style.setProperty('--hint-c', deep);
    nameEl.classList.remove('pop'); void nameEl.offsetWidth; nameEl.classList.add('pop');
    document.body.classList.add('detail');
    document.title = items[index].name + ' · ' + zoneName;
    scene.showDetail(index, dir);
    if (how === 'push') history.pushState({ fromList: true }, '', urlFor(index));
    if (how === 'replace') history.replaceState(history.state, '', urlFor(index));
  }

  // ----- 목록 모드로 -----
  function openList(how) {
    current = -1;
    setSheet(false);
    document.body.classList.remove('detail');
    document.title = zoneName + ' · 말랑 지도';
    scene.showList();
    if (how === 'replace') history.replaceState(null, '', urlFor(-1));
  }

  function step(dir) { // dir: -1 이전, +1 다음 (끝에 가면 처음으로 돌아감)
    const n = items.length;
    openDetail((current + dir + n) % n, dir, 'replace');
  }

  // 꽃 이름을 손으로 쓴 것처럼: 글자마다 조금씩 다르게 기울이고 위아래로 들쭉날쭉 (유리병 태그·지도 구역 이름과 같은 느낌)
  //   값은 이름에서 만든 고정 난수 → 같은 장미는 늘 같은 모양. 글자 하나하나를 <span>으로 나눠 transform으로 움직임
  function wobbleName(el, name) {
    let h = 2166136261;                                          // 이름 → 난수 씨앗 (FNV 해시)
    for (const ch of name) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    const rand = () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13; return ((h >>> 0) % 10000) / 10000; };
    el.textContent = '';
    el.setAttribute('aria-label', name);                          // 화면 읽기 프로그램은 글자 조각 대신 이름 전체를 읽음
    let flip = rand() < 0.5 ? 1 : -1;
    for (const ch of name) {
      const span = document.createElement('span');
      span.textContent = ch;
      span.setAttribute('aria-hidden', 'true');
      if (ch !== ' ') {
        flip = -flip;                                             // 이웃 글자는 반대로 기울어 더 손글씨 같게
        const angle = flip * (4 + rand() * 5);                    // 4~9°
        const up = (rand() * 2 - 1) * 4;                          // -4 ~ +4px
        span.style.transform = `translateY(${up.toFixed(1)}px) rotate(${angle.toFixed(1)}deg)`;
      }
      el.appendChild(span);
    }
  }

  // 꽃 디자인 색(item.blob.colors.outer = 꽃잎 바깥 색)으로 이름 글자 색 만들기 (블롭 색은 안 바뀜 — 글씨용 계산)
  // 색을 HSL(색상 h · 채도 s · 밝기 l)로 나눠서 "밝기"만 낮춤 → 꽃 색 느낌은 남고 배경 위에서 잘 읽힘
  //   그냥 RGB를 곱해 어둡게 하면: 흰 꽃 → 회색, 노란 꽃 → 올리브색으로 탁해짐. 그래서 두 경우만 따로 처리
  function nameTone(item) {
    const col = (item.blob && item.blob.colors) || {};
    const toHsl = hex => { const o = {}; new THREE.Color(hex).getHSL(o); return o; };   // three.js가 hex → HSL 변환
    // 색 하나를 밝기 light로 진하게 (흰·노랑은 탁해지지 않게 색상을 살짝 옮김)
    const warmDeep = (hex, light) => {
      let { h, s } = toHsl(hex);
      if (s < 0.12) { h = 0.08; s = 0.32; }            // 흰·크림 꽃(채도 거의 0) → 따뜻한 베이지 갈색
      else if (h > 0.1 && h < 0.2) h -= 0.035;          // 노란 꽃 → 살짝 주황 쪽으로
      return '#' + new THREE.Color().setHSL(h, Math.min(1, s * 1.05), light).getHexString();
    };
    // 1단계: 아주 밝은 꽃은 먼저 한 번 진하게 (밝기 0.62 / 0.55), 보통 꽃은 그대로
    const outer = col.outer || col.center || '#E86B86';
    // 분홍 계열(색상 빨강~자홍 · 채도 뚜렷 · 원래 밝음)은 그대로 진하게 내리면 "진한 빨강"이 돼 버림
    //   → 밝기를 0.48까지만 내리고, 채도를 조금 낮추고, 색상을 살짝 자홍 쪽으로 → 진한 분홍(라즈베리) (2026-11-19)
    const o = toHsl(outer);
    if ((o.h > 0.88 || o.h < 0.02) && o.s > 0.3 && o.l > 0.62) {
      const h = o.h > 0.5 ? Math.min(o.h, 0.955) - 0.01 : 0.945;     // 주홍 쪽(0.98~1.0)이면 자홍 쪽으로 당김
      return '#' + new THREE.Color().setHSL(h, Math.min(0.7, o.s * 0.85), 0.48).getHexString();
    }
    const L = o.l;
    const fill = L > 0.72 ? warmDeep(outer, 0.62) : L > 0.6 ? warmDeep(outer, 0.55) : outer;
    // 2단계: 글자 색 = 그 색의 밝기를 약 0.6배 (최대 0.36) → 배경(#f6f1e7) 위에서 또렷하게
    return warmDeep(fill, Math.min(0.36, toHsl(fill).l * 0.62));
  }

  // ----- 정보 영역 채우기 (공통 형태의 필드만 사용) -----
  function renderInfo(item, index) {
    const box = document.getElementById('info-body');
    box.innerHTML = '';
    const h2 = document.createElement('h2');
    if (item.colorHex) { // 꽃색 정보가 있을 때만 색 동그라미
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = item.colorHex2 ? `linear-gradient(${item.colorHex}, ${item.colorHex2})` : item.colorHex;
      h2.appendChild(sw);
    }
    h2.append(item.name);
    box.appendChild(h2);
    if (item.nameEn) { const en = document.createElement('p'); en.className = 'en'; en.textContent = item.nameEn; box.appendChild(en); }
    if (item.tags && item.tags.length) { // 정보가 없으면 칸 자체를 만들지 않음
      const tags = document.createElement('div'); tags.className = 'tags';
      item.tags.forEach(t => { const s = document.createElement('span'); s.textContent = t; tags.appendChild(s); });
      box.appendChild(tags);
    } else {
      h2.style.marginBottom = '12px';
    }
    // 설명 위 한마디 ('이 장미는') — 구역 표(zones.js)의 aboutLabel. 없으면 안 붙임 (이 페이지는 "장미"를 모름)
    if (zone && zone.aboutLabel) { const lb = document.createElement('p'); lb.className = 'about'; lb.textContent = zone.aboutLabel; box.appendChild(lb); }
    const p = document.createElement('p'); p.className = 'desc'; p.textContent = item.description; box.appendChild(p);
    // 사진은 참고용이라 설명 아래에 (주인공은 위의 말랑한 도형)
    const urls = item.imageUrls || (item.imageUrl ? [item.imageUrl] : []);
    if (urls.length) {
      const img = new Image();
      img.className = 'photo'; img.alt = item.name + ' 사진';
      let tryIndex = 0;
      img.src = urls[0];
      img.onerror = () => { // 깨지면 다음 후보로, 후보가 다 떨어지면 사진을 뺌
        tryIndex++;
        if (tryIndex < urls.length) img.src = urls[tryIndex];
        else img.remove();
      };
      box.appendChild(img);
    }
    if (item.detailUrl) {
      const a = document.createElement('a'); a.className = 'more'; a.href = item.detailUrl; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '자세히 보기 →'; box.appendChild(a);
    }
    const count = document.createElement('p'); count.className = 'count';
    count.textContent = `${index + 1} / ${items.length}`;
    box.appendChild(count);
    const credit = document.createElement('p'); credit.className = 'credit';
    credit.textContent = CREDIT;
    box.appendChild(credit);
    document.getElementById('info').scrollTop = 0;
  }

  // ----- TMI 🤓 시트: 버튼을 눌러야 열리고, 다시 눌러야 닫힘 -----
  const tmi = document.getElementById('tmi');
  function setSheet(open) {
    document.body.classList.toggle('sheet-open', open);
    tmi.setAttribute('aria-expanded', String(open));
    if (scene) scene.setSheet(open);
  }
  tmi.addEventListener('click', () => setSheet(!document.body.classList.contains('sheet-open')));

  // ----- 🔍 꽃 찾기: 위 검색창 + 아래 이름 목록 (가나다순, 칠수록 줄어듦) -----
  //   일부만 쳐도 찾고, 띄어쓰기·대소문자는 무시 (예: "데저트피스", "피스" → 데저트 피스)
  const findBtn = document.getElementById('find-btn');
  const findInput = document.getElementById('find-input');
  const findList = document.getElementById('find-list');
  const findNone = document.getElementById('find-none');
  const norm = s => String(s).replace(/\s+/g, '').toLowerCase();
  const sorted = items.map((it, i) => ({ name: it.name, i })).sort((a, b) => a.name.localeCompare(b.name, 'ko'));

  function renderFind() {
    const q = norm(findInput.value);
    const hits = sorted.filter(x => norm(x.name).includes(q));
    findList.innerHTML = '';
    hits.forEach(x => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.type = 'button';
      // 친 글자 부분을 강조 (띄어쓰기 없이 쳐도 원래 이름에서 맞는 글자를 찾아 표시)
      const chars = [...x.name];
      let start = -1, end = -1;
      if (q) {
        const flat = chars.map((ch, idx) => ({ ch: ch.toLowerCase(), idx })).filter(o => !/\s/.test(o.ch));
        const at = flat.map(o => o.ch).join('').indexOf(q);
        if (at >= 0) { start = flat[at].idx; end = flat[at + q.length - 1].idx; }
      }
      chars.forEach((ch, idx) => {
        if (idx === start) { const m = document.createElement('mark'); btn.appendChild(m); }
        const target = (idx >= start && idx <= end && start >= 0) ? btn.lastChild : btn;
        target.append(ch);
      });
      btn.addEventListener('click', () => { setFinder(false); openDetail(x.i, 0, 'push'); });
      li.appendChild(btn);
      findList.appendChild(li);
    });
    findNone.style.display = hits.length ? 'none' : 'block';
    return hits;
  }
  function setFinder(open) {
    document.body.classList.toggle('finder-open', open);
    findBtn.setAttribute('aria-expanded', String(open));
    if (open) { findInput.value = ''; renderFind(); setTimeout(() => findInput.focus(), 50); }
    else findInput.blur();
  }
  findBtn.addEventListener('click', () => setFinder(!document.body.classList.contains('finder-open')));
  findInput.addEventListener('input', renderFind);
  findInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const hits = renderFind(); if (hits.length) { setFinder(false); openDetail(hits[0].i, 0, 'push'); } }
    if (e.key === 'Escape') setFinder(false);
  });
  // 창 밖을 누르면 닫힘
  document.addEventListener('pointerdown', e => {
    if (document.body.classList.contains('finder-open') && !e.target.closest('#finder, #find-btn')) setFinder(false);
  });

  // 꽃을 처음 만지면 안내를 숨김: 상세에선 "꾹 눌러보고…", 말랑이 밭에선 "꽃을 끌어서 굴려보고…"
  document.getElementById('stage').addEventListener('pointerdown', () => {
    document.body.classList.add(current >= 0 ? 'touched' : 'list-touched');
  });

  // ----- 버튼·키보드 -----
  document.getElementById('back').addEventListener('click', e => {
    if (current < 0) return; // 목록 모드: 원래대로 지도로 이동
    e.preventDefault();
    // 목록에서 들어왔으면 브라우저 '뒤로'와 똑같이, 주소로 바로 들어왔으면 목록 주소로 바꿈
    if (history.state && history.state.fromList) history.back();
    else openList('replace');
  });
  document.getElementById('prev').onclick = () => step(-1);
  document.getElementById('next').onclick = () => step(1);
  document.addEventListener('keydown', e => {
    if (current < 0) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'Escape') document.getElementById('back').click();
  });

  // 브라우저 뒤로가기/앞으로가기 → 주소를 다시 읽어서 화면 맞추기
  function syncFromUrl() {
    const name = new URLSearchParams(location.search).get('item');
    const index = items.findIndex(it => it.name === name);
    if (index >= 0) { if (index !== current) openDetail(index, 0, 'none'); }
    else if (current >= 0) openList('none');
  }
  window.addEventListener('popstate', syncFromUrl);
  syncFromUrl(); // 처음 열 때 주소에 item이 있으면 바로 상세 모드
})();
</script>
</body>
